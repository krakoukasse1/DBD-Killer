    <header>
        <div class="header-left">

   <ul class="list-ul">
    <li class="list-li"><a href="index.html">A propos</a></li>

<body>
    <div id="character-container">

    </div>
    <button class="roulette-draw">Tirage</button>
        
        <script src="main.js"></script>
        </script>
 <script>
      const twitchBtn = document.querySelector('#twitch-btn .twitch-button');

async function updateTwitchButton() {
  const resp = await fetch('/api/twitch-user');
  const data = await resp.json();

  if (data.connected) {
    // Si connecté, afficher avatar et nom
    twitchBtn.innerHTML = `
      <img src="${data.avatar}" alt="${data.display_name}" class="twitch-avatar">
      <span>${data.display_name}</span>
    `;
    twitchBtn.style.borderColor = 'green';
    twitchBtn.style.color = 'white';
    
    // Cliquer pour se déconnecter
    twitchBtn.onclick = async () => {
      if (confirm("Voulez-vous vous déconnecter ?")) {
        await fetch('/api/logout', { method: 'POST' });
        window.location.reload();
      }
    };
  } else {
    // Sinon, bouton pour se connecter
    twitchBtn.innerHTML = `
      <img src="assets/twitch_logo.png" alt="Twitch" class="twitch-icon">
      <span>Connexion Twitch</span>
    `;
    twitchBtn.style.borderColor = 'magenta';
    twitchBtn.style.color = 'magenta';
    
    twitchBtn.onclick = () => {
      window.location.href = '/auth/twitch';
    };
  }
}

// Appel au chargement
updateTwitchButton();

      // Ping backend toutes les 1 minute (pour test)
      setInterval(() => {
        fetch('/ping')
          .then(res => console.log("Ping OK"))
          .catch(() => console.log("Ping échoué"));
      }, 60 * 1000); // 60 000 ms = 1 minute
    </script>
</body>
</html>
