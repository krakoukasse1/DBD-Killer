<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette Maps — DBD</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .map-page { 
  max-width: 1200px; 
  margin: 0 auto; 
  padding: 40px 20px 80px; 
  text-align: center; 
}

.map-hero h1 { 
  font-size: clamp(3rem, 7vw, 5.5rem); 
  color: #fff; 
  letter-spacing: 4px; 
  margin-bottom: 30px; 
}
.map-hero h1 span { 
  color: #cc0000; 
}

/* GRILLE DES CARTES */
.maps-grid {
  display: grid;
  /* CORRECTION : minmax à 140px au lieu de 180px pour afficher plus de colonnes et éviter le défilement */
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 6px;
  margin-bottom: 40px;
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.maps-grid.fade-out { 
  opacity: 0; 
  transform: scale(0.9); 
  pointer-events: none; 
}

.map-card {
  position: relative;
  background: #111;
  border: 2px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  overflow: hidden;
  aspect-ratio: 16/10;
  filter: brightness(0.35); /* Sombre par défaut */
  transition: border-color 0.2s, filter 0.1s ease, transform 0.2s ease, box-shadow 0.2s ease;
}
.map-card img { 
  width: 100%; 
  height: 100%; 
  object-fit: cover; 
}

/* NOUVELLE SÉLECTION TYPE "ROUGE DBD" (Adieu le rectangle jaune Mario Kart) */
.map-card.highlight {
  filter: brightness(1.2) saturate(1.2);
  border-color: #cc0000;
  box-shadow: 0 0 20px 4px rgba(204, 0, 0, 0.8), inset 0 0 15px rgba(204, 0, 0, 0.5);
  transform: scale(1.06);
  z-index: 10;
  animation: map-winner-pulse 1.2s ease-in-out infinite alternate;
}

@keyframes map-winner-pulse {
  0% {
    box-shadow: 0 0 15px 2px rgba(204, 0, 0, 0.7);
  }
  100% {
    box-shadow: 0 0 25px 6px rgba(204, 0, 0, 1);
    transform: scale(1.08);
  }
}

.map-card.disabled {
  filter: brightness(0.15) grayscale(1); /* Plus sombre et totalement en noir et blanc */
  border-color: rgba(255, 0, 0, 0.3); /* Bordure rouge très sombre */
  cursor: not-allowed;
}

/* Optionnel : Ajoute une petite mention "Indisponible" par-dessus la carte */
.map-card.disabled::after {
  content: "DÉSACTIVÉE";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(-15deg);
  background: rgba(204, 0, 0, 0.8);
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  padding: 2px 8px;
  letter-spacing: 1px;
  border-radius: 4px;
}

/* BOUTON LANCER */
.btn-draw-map {
  display: block; width: 100%; max-width: 350px; margin: 0 auto; padding: 16px;
  background: #cc0000; color: #fff; border: none; border-radius: 8px;
  font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 2px;
  cursor: pointer; transition: background 0.2s, transform 0.15s;
}
.btn-draw-map:hover { background: #b30000; transform: scale(1.02); }
.btn-draw-map:disabled { background: #441111; color: #888; cursor: not-allowed; transform: none; }

/* ÉCRAN DU RÉSULTAT FINAL RECHERCHÉ */
.final-result-container {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.7);
  transition: opacity 1s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.final-result-container.visible { display: flex; opacity: 1; transform: scale(1); }

.final-map-img-wrap {
  width: 100%; max-width: 650px;
  aspect-ratio: 16/9;
  border: 4px solid #cc0000;
  border-radius: 16px;
  box-shadow: 0 0 40px rgba(204, 0, 0, 0.4);
  overflow: hidden;
  margin-bottom: 20px;
}
.final-map-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

.final-map-realm { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; color: #fff; letter-spacing: 2px; margin: 0; }
.final-map-name { font-family: sans-serif; font-size: 1.2rem; color: #aaa; margin: 5px 0 25px; }
  </style>
</head>
<body>

<header id="site-header"></header> <main class="map-page">
  <div class="map-hero" id="hero-section">
    <h1>Roulette <span>Maps</span></h1>
  </div>

  <button class="btn-draw-map" id="draw-btn">🎲 Sélectionner une Map</button>
  <br><br>

  <div class="maps-grid" id="maps-grid"></div>

  <div class="final-result-container" id="final-result">
    <div class="final-map-img-wrap">
      <img id="final-img" src="" alt="Map">
    </div>
    <h2 class="final-map-realm" id="final-realm">Nom du Royaume</h2>
    <p class="final-map-name" id="final-name">Nom de la structure</p>
    <button class="btn-draw-map" id="reset-btn" style="background:transparent; border:1px solid #555;">↻ Recommencer</button>
  </div>
</main>

<script src="header.js"></script>
<script>
(async function() {
  const maps = await fetch('maps.json').then(r => r.json());
  const grid = document.getElementById('maps-grid');
  const drawBtn = document.getElementById('draw-btn');
  const finalContainer = document.getElementById('final-result');

  // Mélanger le tableau de maps (Fisher-Yates) et générer la grille HTML
  function shuffleAndBuildGrid() {
    grid.innerHTML = '';
    const shuffledMaps = [...maps].sort(() => Math.random() - 0.5);
    
    shuffledMaps.forEach((map, index) => {
      const card = document.createElement('div');
      card.className = 'map-card';
      card.dataset.index = index;
      card.dataset.realm = map.realm;
      card.dataset.name = map.name;
      card.dataset.img = map.img;

      const img = document.createElement('img');
      img.src = `assets/maps/${map.img}`;
      img.onerror = () => { img.src = 'assets/dbd logo.png'; }; // Sécurité image manquante
      
      card.appendChild(img);
      grid.appendChild(card);
    });
  }

  shuffleAndBuildGrid();

 drawBtn.addEventListener('click', async () => {
    drawBtn.disabled = true;
    
    // CHARGEMENT ET CONFIGURATION DU SON
    const rollSound = new Audio('assets/Roll.mp3');
    rollSound.volume = 0.4;

    const allCards = document.querySelectorAll('.map-card');
    const activeCards = document.querySelectorAll('.map-card:not(.disabled)');
    
    if (activeCards.length === 0) {
        drawBtn.disabled = false;
        return;
    }

    // 1. TIRAGE AU SORT DU GAGNANT
    const randomActiveCard = activeCards[Math.floor(Math.random() * activeCards.length)];
    const targetIndex = Array.from(allCards).indexOf(randomActiveCard);

    // 2. CONFIGURATION DE L'ANIMATION
    let currentIndex = 0;
    let currentDelay = 50; // Vitesse rapide constante du début
    const minDuration = 7000; // Reste à fond pendant au moins 7 secondes
    const startTime = Date.now();
    let isBraking = false;
    let stepsToTarget = 0;
    let initialBrakingSteps = 0;

    function tick() {
        // Retirer la surbrillance de toutes les cartes
        allCards.forEach(c => c.classList.remove('highlight'));
        
        // Allumer la carte actuelle
        allCards[currentIndex].classList.add('highlight');

        // Jouer le son
        rollSound.currentTime = 0; 
        rollSound.play().catch(o => {});

        const elapsed = Date.now() - startTime;

        // 3. ENCLENCHEMENT DU FREINAGE SUR LES DERNIERS ÉLÉMENTS
        if (!isBraking && elapsed >= minDuration) {
            isBraking = true;
            // On calcule la distance (le nombre de cartes) qui nous sépare de la cible
            // On ajoute un tour complet (allCards.length) pour avoir le temps de freiner proprement
            stepsToTarget = (targetIndex - currentIndex + allCards.length) % allCards.length + allCards.length;
            initialBrakingSteps = stepsToTarget;
        }

        // 4. GESTION DE L'ARRÊT ET DE LA VITESSE
        if (isBraking) {
            if (stepsToTarget === 0 && currentIndex === targetIndex) {
                // ARRÊT PILE SUR LA CIBLE
                endAnimation(allCards[currentIndex]);
                return; 
            }
            
            // Calcul du ralentissement uniquement basé sur la proximité de la cible
            // Plus "stepsToTarget" est proche de 0, plus le délai augmente fortement
            const brakeProgress = 1 - (stepsToTarget / initialBrakingSteps);
            currentDelay = 50 + Math.pow(brakeProgress, 4) * 750; // Puissance 4 pour un freinage sec sur la fin
            
            stepsToTarget--;
        } else {
            // Tant qu'on ne freine pas, petite variation aléatoire de vitesse pour casser la monotonie
            currentDelay = 45 + Math.random() * 10;
        }

        // Passer à la carte suivante
        currentIndex = (currentIndex + 1) % allCards.length;

        setTimeout(tick, currentDelay);
    }

    tick();
});

  function endAnimation(winner) {
    setTimeout(() => {
      // 1. Faire s'évanouir toute la grille
      grid.classList.add('fade-out');
      drawBtn.style.display = 'none';
      document.getElementById('hero-section').style.display = 'none';

      // 2. Préparer le bloc du résultat final
      document.getElementById('final-img').src = `assets/maps/${winner.dataset.img}`;
      document.getElementById('final-realm').textContent = winner.dataset.realm;
      document.getElementById('final-name').textContent = winner.dataset.name;

      setTimeout(() => {
        // 3. Afficher en grand avec l'effet fluide
        grid.style.display = 'none';
        finalContainer.classList.add('visible');
        
        // 4. SAUVEGARDE ET TWITCH DANS LE BACKEND
        fetch("/api/draw-and-announce", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            items: [winner.dataset.realm],
            characterType: "Map",
            drawMode: "map", // Nouvelle valeur pour cibler un onglet "Maps"
            img: winner.dataset.img,
            perks: []
          })
        }).catch(err => console.warn("Sauvegarde échouée", err));

      }, 800); // Temps correspondant à la transition CSS d'évanouissement
    }, 1000); // Petite pause dramatique sur la carte sélectionnée
  }

  // Bouton Recommencer
  document.getElementById('reset-btn').addEventListener('click', () => {
    finalContainer.classList.remove('visible');
    grid.style.display = 'grid';
    setTimeout(() => {
      grid.classList.remove('fade-out');
      drawBtn.style.display = 'block';
      drawBtn.disabled = false;
      document.getElementById('hero-section').style.display = 'block';
      shuffleAndBuildGrid();
    }, 400);
  });
})();
</script>
</body>
</html>
