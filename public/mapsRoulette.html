<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette Maps — DBD</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===========================
   GLOBAL
=========================== */
* {
    box-sizing: border-box;
    font-family: 'Bebas Neue', sans-serif;
    margin: 0;
    padding: 0;
}

body {
    background-image: url("assets/background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: burlywood;
    height: 100vh;
    overflow: hidden; /* Empêche le scroll global si tout tient sur l'écran */
}

/* Filtre sombre pour la lisibilité */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    pointer-events: none;
    z-index: -1;
}

/* ===========================
   HEADER
=========================== */
header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background-color: rgba(0, 0, 0, 0.7);
    height: 70px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.img-logo {
    height: 50px;
    width: auto;
}

.list-ul {
    display: flex;
    flex-wrap: wrap;
    list-style: none;
    gap: 10px;
}

.list-li {
    list-style: none;
    margin: 0;
    padding: 0 10px;
    height: 40px;
    display: flex;
    align-items: center;
}

.list-li a {
    color: blanchedalmond;
    padding: 5px 10px;
    border-left: 2px solid ghostwhite;
    border-right: 2px solid ghostwhite;
    transition: 0.3s;
    text-decoration: none;
}

.list-li a:hover {
    transform: scale(1.1);
    background-color: red;
}

/* ===========================
   BODY / CONTENEUR MAPS
=========================== */
.body-index {
    margin: 10px auto;
    padding: 15px;
    max-width: 1400px;
    height: calc(100vh - 100px); /* Prend l'espace restant sans dépasser */
    background-color: rgba(20, 20, 20, 0.7);
    border-radius: 10px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.body-index h1 {
    font-size: 2.5rem;
    margin-bottom: 5px;
    color: #fff;
    letter-spacing: 2px;
}

/* ===========================
   GRILLE DES MAPS (Plus compacte)
=========================== */
#maps-container {
    display: grid;
    /* Augmente le nombre de colonnes en réduisant la taille min des maps (130px au lieu de 200px) */
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    padding: 15px;
    background-color: rgba(0, 0, 0, 0.4);
    border-radius: 8px;
    overflow-y: auto; /* Au cas où il y aurait vraiment trop de maps sur un écran minuscule */
    max-height: 60vh; 
}

.map-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.5);
    transition: transform 0.2s, box-shadow 0.2s;
}

.map-card img {
    width: 100%;
    height: 90px; /* Hauteur fixe réduite pour tasser les lignes */
    object-fit: cover;
    display: block;
    filter: brightness(0.7);
    transition: filter 0.3s, transform 0.3s;
}

.map-name {
    padding: 4px;
    font-size: 0.9rem;
    text-align: center;
    width: 100%;
    background: rgba(0, 0, 0, 0.8);
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Hover basique sur une map */
.map-card:hover img {
    filter: brightness(1);
}

/* ===========================
   NOUVELLE ESTHÉTIQUE DE SÉLECTION (EFFET GLOW ROUGE)
=========================== */
.map-card.selected {
    transform: scale(1.05);
    z-index: 2;
    box-shadow: 0 0 15px 3px rgba(255, 0, 0, 0.8), inset 0 0 15px rgba(255, 0, 0, 0.5);
    animation: pulse-selection 1.5s infinite alternate;
}

.map-card.selected img {
    filter: brightness(1.2) saturate(1.2);
}

.map-card.selected .map-name {
    color: #ff3333;
    background: rgba(20, 0, 0, 0.9);
    font-weight: bold;
}

@keyframes pulse-selection {
    0% {
        box-shadow: 0 0 12px 2px rgba(255, 0, 0, 0.7);
    }
    100% {
        box-shadow: 0 0 20px 5px rgba(255, 0, 0, 0.9);
    }
}

/* ===========================
   BOUTON DE TIRAGE & RÉSULTAT
=========================== */
.roulette-draw {
    display: inline-block;
    margin: 10px auto;
    padding: 10px 40px;
    font-size: 1.8rem;
    background-color: red;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
    letter-spacing: 1px;
}

.roulette-draw:hover {
    transform: scale(1.05);
    background-color: #cc0000;
}

.winner {
    min-height: 35px;
    font-size: 1.5rem;
    color: burlywood;
    letter-spacing: 1.5px;
    text-shadow: 0 0 10px rgba(255,0,0,0.4);
}

/* ===========================
   RESPONSIVE
=========================== */
@media screen and (max-width: 768px) {
    body { overflow-y: auto; }
    .body-index { height: auto; }
    #maps-container { max-height: none; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
    .map-card img { height: 70px; }
}
  </style>
</head>
<body>

<header id="site-header"></header> <main class="map-page">
  <div class="map-hero" id="hero-section">
    <h1>Roulette <span>Maps</span></h1>
  </div>

  <button class="btn-draw-map" id="draw-btn">🎲 Sélectionner une Map</button>
  <br><br>

  <div class="maps-grid" id="maps-grid"></div>

  <div class="final-result-container" id="final-result">
    <div class="final-map-img-wrap">
      <img id="final-img" src="" alt="Map">
    </div>
    <h2 class="final-map-realm" id="final-realm">Nom du Royaume</h2>
    <p class="final-map-name" id="final-name">Nom de la structure</p>
    <button class="btn-draw-map" id="reset-btn" style="background:transparent; border:1px solid #555;">↻ Recommencer</button>
  </div>
</main>

<script src="header.js"></script>
<script>
(async function() {
  const maps = await fetch('maps.json').then(r => r.json());
  const grid = document.getElementById('maps-grid');
  const drawBtn = document.getElementById('draw-btn');
  const finalContainer = document.getElementById('final-result');

  // Mélanger le tableau de maps (Fisher-Yates) et générer la grille HTML
  function shuffleAndBuildGrid() {
    grid.innerHTML = '';
    const shuffledMaps = [...maps].sort(() => Math.random() - 0.5);
    
    shuffledMaps.forEach((map, index) => {
      const card = document.createElement('div');
      card.className = 'map-card';
      card.dataset.index = index;
      card.dataset.realm = map.realm;
      card.dataset.name = map.name;
      card.dataset.img = map.img;

      const img = document.createElement('img');
      img.src = `assets/maps/${map.img}`;
      img.onerror = () => { img.src = 'assets/dbd logo.png'; }; // Sécurité image manquante
      
      card.appendChild(img);
      grid.appendChild(card);
    });
  }

  shuffleAndBuildGrid();

  drawBtn.addEventListener('click', async () => {
    drawBtn.disabled = true;
    const cards = document.querySelectorAll('.map-card');
    if(cards.length === 0) return;

    let currentIndex = 0;
    let currentDelay = 50; // Vitesse de départ ultra rapide (ms)
    const maxDuration = 9000; // Durée de l'animation en millisecondes (~9 à 10s pour le suspense)
    const startTime = Date.now();

    function tick() {
      // Retirer la surbrillance de la carte précédente
      cards.forEach(c => c.classList.remove('highlight'));
      
      // Allumer la carte actuelle
      cards[currentIndex].classList.add('highlight');

      // Passer à la carte suivante
      currentIndex = (currentIndex + 1) % cards.length;

      const elapsed = Date.now() - startTime;

      if (elapsed < maxDuration) {
        // Ralentissement progressif (effet Mario Kart)
        // Plus le temps passe, plus le délai augmente exponentiellement
        currentDelay = 50 + Math.pow(elapsed / maxDuration, 3) * 600;
        setTimeout(tick, currentDelay);
      } else {
        // ARRÊT DU TIRAGE : La carte allumée actuellement est la gagnante !
        const winnerCard = cards[(currentIndex - 1 + cards.length) % cards.length];
        endAnimation(winnerCard);
      }
    }

    tick();
  });

  function endAnimation(winner) {
    setTimeout(() => {
      // 1. Faire s'évanouir toute la grille
      grid.classList.add('fade-out');
      drawBtn.style.display = 'none';
      document.getElementById('hero-section').style.display = 'none';

      // 2. Préparer le bloc du résultat final
      document.getElementById('final-img').src = `assets/Maps/${winner.dataset.img}`;
      document.getElementById('final-realm').textContent = winner.dataset.realm;
      document.getElementById('final-name').textContent = winner.dataset.name;

      setTimeout(() => {
        // 3. Afficher en grand avec l'effet fluide
        grid.style.display = 'none';
        finalContainer.classList.add('visible');
        
        // 4. SAUVEGARDE ET TWITCH DANS LE BACKEND
        fetch("/api/draw-and-announce", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            items: [winner.dataset.realm],
            characterType: "Map",
            drawMode: "map", // Nouvelle valeur pour cibler un onglet "Maps"
            img: winner.dataset.img,
            perks: []
          })
        }).catch(err => console.warn("Sauvegarde échouée", err));

      }, 800); // Temps correspondant à la transition CSS d'évanouissement
    }, 1000); // Petite pause dramatique sur la carte sélectionnée
  }

  // Bouton Recommencer
  document.getElementById('reset-btn').addEventListener('click', () => {
    finalContainer.classList.remove('visible');
    grid.style.display = 'grid';
    setTimeout(() => {
      grid.classList.remove('fade-out');
      drawBtn.style.display = 'block';
      drawBtn.disabled = false;
      document.getElementById('hero-section').style.display = 'block';
      shuffleAndBuildGrid();
    }, 400);
  });
})();
</script>
</body>
</html>
