<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette Maps — DBD</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
   /* ===========================
   GLOBAL
=========================== */
* {
    box-sizing: border-box;
    font-family: 'Bebas Neue', sans-serif;
    margin: 0;
    padding: 0;
}

body {
    background-image: url("assets/background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: burlywood;
}

/* Filtre sombre pour que le contenu reste lisible */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: -1;
}

/* ===========================
   HEADER
=========================== */
header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background-color: rgba(0, 0, 0, 0.7);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.img-logo {
    height: 80px;
    width: auto;
}

/* Hamburger */
.hamburger {
    display: none;
    font-size: 2rem;
    cursor: pointer;
    color: blanchedalmond;
}

.list-ul {
    display: flex;
    flex-wrap: wrap;
    list-style: none;
    gap: 10px;
}

.list-li {
    list-style: none;
    margin: 0;
    padding: 0 10px;
    height: 40px;
    display: flex;
    align-items: center;
}

.list-li a {
    color: blanchedalmond;
    padding: 5px 10px;
    border-left: 2px solid ghostwhite;
    border-right: 2px solid ghostwhite;
    transition: 0.3s;
    text-decoration: none;
}

.list-li a:hover {
    transform: scale(1.1);
    background-color: red;
}

/* Twitch connect / avatar */
#twitchContainer {
    display: flex;
    align-items: center;
}

.twitch-button {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    height: 100%;
    border: 2px solid magenta;
    border-radius: 5px;
    background-color: black;
    color: magenta;
    font-weight: bold;
    cursor: pointer;
}

.twitch-button:hover {
    background-color: magenta;
    color: black;
}

.twitch-icon {
    width: 24px;
    height: 24px;
}

.img-button {
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
}

.img-button img {
    display: block;
    width: 100%;
    height: auto;
}

.twitch-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    cursor: pointer;
}

/* ===========================
   BODY SECTION
=========================== */
.body-index {
    margin: 20px auto;
    padding: 20px;
    max-width: 1200px;
    background-color: rgba(51, 51, 51, 0.6);
    border-radius: 10px;
    text-align: center;
}

.body-index h1, 
.body-index h2 {
    margin-bottom: 15px;
}

/* ===========================
   BUTTON TIRAGE
=========================== */
.roulette-draw {
    display: block;
    margin: 20px auto;
    padding: 20px 50px;
    font-size: 2rem;
    background-color: red;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
    text-align: center;
}

.roulette-draw:hover {
    transform: scale(1.1);
}

/* ===========================
   CHARACTER LIST / CONTAINER MAPS (Optionnel)
=========================== */
#character-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    padding: 10px;
    background-color: rgba(0, 9, 12, 0.5);
    border-radius: 10px;
}

.character {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 200px;
}

.character img {
    width: 100%;
    height: auto;
    border-radius: 10px;
    transition: transform 0.3s, background-color 0.3s;
}

.character img:hover {
    transform: scale(1.05);
    background-color: brown;
}

.name-character {
    margin-top: 5px;
    text-align: center;
}

/* ===========================
   ROULETTE (Retour au défilement horizontal classe)
=========================== */
.roulette-container {
    width: 95%;
    max-width: 1200px;
    height: 240px; /* Hauteur ajustée pour être moins massive à l'écran */
    margin: 30px auto;
    overflow: hidden;
    position: relative;
    display: flex;
    border: 2px solid rgba(255, 0, 0, 0.4);
    border-radius: 6px;
    background-color: rgba(10, 10, 10, 0.85);
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.15), inset 0 0 60px rgba(0,0,0,0.5);
}

/* Vignette gauche/droite pour effet de profondeur */
.roulette-container::before,
.roulette-container::after {
    content: "";
    position: absolute;
    top: 0;
    width: 18%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
}
.roulette-container::before {
    left: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.9), transparent);
}
.roulette-container::after {
    right: 0;
    background: linear-gradient(to left, rgba(0,0,0,0.9), transparent);
}

#roulette-items {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 10px 0;
    flex-direction: row;
    transition: transform 5s cubic-bezier(0.15, 0.84, 0.36, 1);
}

.item {
    flex: 0 0 auto;
    width: 160px; /* Largeur fixe pour avoir plus de colonnes visibles horizontalement */
    margin: 0 6px;
    border-radius: 6px;
    overflow: hidden;
    transition: filter 0.4s, transform 0.4s;
    filter: brightness(0.4) saturate(0.6); /* Plus sombre de base pour faire ressortir le gagnant */
}

.item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Ligne centrale — double trait avec glow */
.red-line {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 100%;
    background: linear-gradient(to bottom, transparent, #ff0000 20%, #ff0000 80%, transparent);
    box-shadow: 0 0 10px 2px rgba(255, 0, 0, 0.7);
    z-index: 4;
}
.red-line::before,
.red-line::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 100%;
    background: rgba(255,80,80,0.3);
}
.red-line::before { margin-left: -8px; }
.red-line::after  { margin-left:  8px; }

/* ===========================
   NOUVEL EFFET SÉLECTIONNÉ (GLOW & LUMIÈRE SANS JAUNE)
=========================== */
.selected-item {
    filter: brightness(1.2) saturate(1.2) !important;
    transform: scale(1.06);
    z-index: 5;
}

.selected-item > img {
    background: none;
    /* Lueur rouge intense autour et dans l'image (adieu le rectangle jaune) */
    box-shadow: 0 0 20px 4px rgba(255, 0, 0, 0.8), inset 0 0 15px rgba(255, 0, 0, 0.5);
    border-radius: 6px;
    animation: winner-pulse-red 1.2s ease-in-out infinite alternate;
}

@keyframes winner-pulse-red {
    0%   { box-shadow: 0 0 15px 3px rgba(255, 0, 0, 0.7); }
    100% { box-shadow: 0 0 25px 6px rgba(255, 0, 0, 1); transform: scale(1.02); }
}

/* Texte résultat */
.winner {
    text-align: center;
    margin-top: 20px;
    font-size: 0;
    opacity: 0;
    transition: none;
}

.winner.visible {
    font-size: 28px;
    opacity: 1;
    animation: winner-appear 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    color: burlywood;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(255,140,0,0.5);
}

@keyframes winner-appear {
    from { opacity: 0; transform: translateY(12px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
}

/* ===========================
   PROFILE
=========================== */
.profile-container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 20px;
}

.profile-avatar {
    width: 80px;
    border-radius: 50%;
}

.section {
    display: none;
    padding: 10px;
}

.section.active {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.section img {
    width: 100px;
    cursor: pointer;
}

.section img.selected {
    border: 3px solid red;
}

.settings {
    margin-top: 20px;
    display: flex;
    gap: 20px;
}

#saveBtn {
    margin-top: 20px;
    padding: 10px;
    font-size: 20px;
    background: red;
    border: none;
    cursor: pointer;
}

#history {
    width: 100%;
    margin-top: 20px;
}

/* ===========================
   COOKIE BANNER
=========================== */
.cookie-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(10, 10, 10, 0.96);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    z-index: 999;
    backdrop-filter: blur(10px);
    animation: slide-up 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes slide-up {
    from { transform: translateY(100%); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
}

.cookie-banner p {
    font-family: sans-serif;
    font-size: 0.83rem;
    color: rgba(220, 220, 220, 0.85);
    margin: 0;
    flex: 1;
    min-width: 240px;
    line-height: 1.5;
}

.cookie-banner a {
    color: #ff6060;
    text-decoration: underline;
}

.cookie-banner-actions {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
}

.cookie-accept {
    padding: 9px 22px;
    background: red;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
}

.cookie-accept:hover {
    background: #cc0000;
    transform: scale(1.03);
}

.cookie-decline {
    padding: 9px 18px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    color: rgba(255, 255, 255, 0.5);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
}

.cookie-decline:hover {
    border-color: rgba(255, 255, 255, 0.4);
    color: rgba(255, 255, 255, 0.85);
}

/* ===========================
   FOOTER
=========================== */
.site-footer {
    text-align: center;
    padding: 20px;
    margin-top: 20px;
}

.site-footer a {
    font-family: sans-serif;
    font-size: 0.78rem;
    color: rgba(255, 255, 255, 0.3);
    text-decoration: none;
    transition: color 0.2s;
    letter-spacing: 0.5px;
}

.site-footer a:hover {
    color: rgba(255, 100, 100, 0.7);
}

/* ===========================
   RESPONSIVE
=========================== */
@media screen and (max-width: 1024px) {
    .img-logo { height: 70px; }
    .twitch-avatar { width: 40px; height: 40px; }
    .item { width: 140px; }
    .winner.visible { font-size: 22px; }
}

@media screen and (max-width: 768px) {
    header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
    }
    .hamburger { display: block; }
    .list-ul { display: none; flex-direction: column; width: 100%; background-color: rgba(0,0,0,0.8); position: absolute; top: 70px; left: 0; padding: 10px; }
    .list-ul.show { display: flex; }
    .item { width: 120px; }
    .roulette-container { height: 180px; }
}

@media screen and (max-width: 480px) {
    .img-logo { height: 50px; }
    .twitch-avatar { width: 35px; height: 35px; }
    .item { width: 100px; margin: 0 3px; }
    .roulette-container { height: 140px; }
    .winner.visible { font-size: 18px; }
    .body-index h1, .body-index h2 { font-size: 18px; }
    .roulette-draw { padding: 15px 30px; font-size: 1.5rem; }
}
  </style>
</head>
<body>

<header id="site-header"></header> <main class="map-page">
  <div class="map-hero" id="hero-section">
    <h1>Roulette <span>Maps</span></h1>
  </div>

  <button class="btn-draw-map" id="draw-btn">🎲 Sélectionner une Map</button>
  <br><br>

  <div class="maps-grid" id="maps-grid"></div>

  <div class="final-result-container" id="final-result">
    <div class="final-map-img-wrap">
      <img id="final-img" src="" alt="Map">
    </div>
    <h2 class="final-map-realm" id="final-realm">Nom du Royaume</h2>
    <p class="final-map-name" id="final-name">Nom de la structure</p>
    <button class="btn-draw-map" id="reset-btn" style="background:transparent; border:1px solid #555;">↻ Recommencer</button>
  </div>
</main>

<script src="header.js"></script>
<script>
(async function() {
  const maps = await fetch('maps.json').then(r => r.json());
  const grid = document.getElementById('maps-grid');
  const drawBtn = document.getElementById('draw-btn');
  const finalContainer = document.getElementById('final-result');

  // Mélanger le tableau de maps (Fisher-Yates) et générer la grille HTML
  function shuffleAndBuildGrid() {
    grid.innerHTML = '';
    const shuffledMaps = [...maps].sort(() => Math.random() - 0.5);
    
    shuffledMaps.forEach((map, index) => {
      const card = document.createElement('div');
      card.className = 'map-card';
      card.dataset.index = index;
      card.dataset.realm = map.realm;
      card.dataset.name = map.name;
      card.dataset.img = map.img;

      const img = document.createElement('img');
      img.src = `assets/maps/${map.img}`;
      img.onerror = () => { img.src = 'assets/dbd logo.png'; }; // Sécurité image manquante
      
      card.appendChild(img);
      grid.appendChild(card);
    });
  }

  shuffleAndBuildGrid();

  drawBtn.addEventListener('click', async () => {
    drawBtn.disabled = true;
    const cards = document.querySelectorAll('.map-card');
    if(cards.length === 0) return;

    let currentIndex = 0;
    let currentDelay = 50; // Vitesse de départ ultra rapide (ms)
    const maxDuration = 9000; // Durée de l'animation en millisecondes (~9 à 10s pour le suspense)
    const startTime = Date.now();

    function tick() {
      // Retirer la surbrillance de la carte précédente
      cards.forEach(c => c.classList.remove('highlight'));
      
      // Allumer la carte actuelle
      cards[currentIndex].classList.add('highlight');

      // Passer à la carte suivante
      currentIndex = (currentIndex + 1) % cards.length;

      const elapsed = Date.now() - startTime;

      if (elapsed < maxDuration) {
        // Ralentissement progressif (effet Mario Kart)
        // Plus le temps passe, plus le délai augmente exponentiellement
        currentDelay = 50 + Math.pow(elapsed / maxDuration, 3) * 600;
        setTimeout(tick, currentDelay);
      } else {
        // ARRÊT DU TIRAGE : La carte allumée actuellement est la gagnante !
        const winnerCard = cards[(currentIndex - 1 + cards.length) % cards.length];
        endAnimation(winnerCard);
      }
    }

    tick();
  });

  function endAnimation(winner) {
    setTimeout(() => {
      // 1. Faire s'évanouir toute la grille
      grid.classList.add('fade-out');
      drawBtn.style.display = 'none';
      document.getElementById('hero-section').style.display = 'none';

      // 2. Préparer le bloc du résultat final
      document.getElementById('final-img').src = `assets/Maps/${winner.dataset.img}`;
      document.getElementById('final-realm').textContent = winner.dataset.realm;
      document.getElementById('final-name').textContent = winner.dataset.name;

      setTimeout(() => {
        // 3. Afficher en grand avec l'effet fluide
        grid.style.display = 'none';
        finalContainer.classList.add('visible');
        
        // 4. SAUVEGARDE ET TWITCH DANS LE BACKEND
        fetch("/api/draw-and-announce", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            items: [winner.dataset.realm],
            characterType: "Map",
            drawMode: "map", // Nouvelle valeur pour cibler un onglet "Maps"
            img: winner.dataset.img,
            perks: []
          })
        }).catch(err => console.warn("Sauvegarde échouée", err));

      }, 800); // Temps correspondant à la transition CSS d'évanouissement
    }, 1000); // Petite pause dramatique sur la carte sélectionnée
  }

  // Bouton Recommencer
  document.getElementById('reset-btn').addEventListener('click', () => {
    finalContainer.classList.remove('visible');
    grid.style.display = 'grid';
    setTimeout(() => {
      grid.classList.remove('fade-out');
      drawBtn.style.display = 'block';
      drawBtn.disabled = false;
      document.getElementById('hero-section').style.display = 'block';
      shuffleAndBuildGrid();
    }, 400);
  });
})();
</script>
</body>
</html>
