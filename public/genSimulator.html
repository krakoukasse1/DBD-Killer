<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gen Simulator — DBD Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --dbd-red: #ff0000;
      --dbd-progress: #bb0a0a;
      --dbd-bg: #0a0a0a;
      --qte-size: 180px;
    }

    body {
      margin: 0;
      background-color: #050505;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ══ BARRE DE RÉPARATION (STYLE DBD) ══ */
    .repair-container {
      width: 400px;
      margin-bottom: 50px;
      position: relative;
    }

    .repair-label {
      font-size: 1.2rem;
      letter-spacing: 2px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .repair-bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      box-shadow: inset 0 0 10px #000;
    }

    .repair-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #660000, var(--dbd-red));
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
      transition: width 0.1s linear;
    }

    /* ══ SKILL CHECK (QTE) ══ */
    .qte-wrapper {
      position: relative;
      width: var(--qte-size);
      height: var(--qte-size);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden; /* Caché par défaut */
    }

    .qte-wrapper.active { visibility: visible; }

    /* Le cercle de base */
    .qte-circle {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      box-sizing: border-box;
    }

    /* Les Zones (SVG pour la précision des arcs) */
    .qte-svg {
      position: absolute;
      transform: rotate(-90deg); /* Début à midi */
      width: 100%;
      height: 100%;
    }

    .zone-good {
      fill: none;
      stroke: white;
      stroke-width: 12;
      opacity: 0.8;
    }

    .zone-great {
      fill: none;
      stroke: white;
      stroke-width: 12;
    }

    /* L'aiguille rouge */
    .needle {
      position: absolute;
      width: 4px;
      height: 50%;
      background: var(--dbd-red);
      bottom: 50%;
      left: calc(50% - 2px);
      transform-origin: bottom center;
      z-index: 10;
      box-shadow: 0 0 8px red;
    }

    /* Le centre "Space" */
    .qte-center {
      width: 70px;
      height: 35px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    /* Feedback text */
    .feedback {
      position: absolute;
      top: -40px;
      font-size: 1.5rem;
      text-shadow: 0 0 10px black;
      opacity: 0;
    }

    .feedback.show { animation: fadeUp 0.8s forwards; }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(0); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px); }
    }

    .controls { margin-top: 40px; }
    button {
      padding: 10px 30px;
      font-family: 'Bebas Neue';
      font-size: 1.5rem;
      background: var(--dbd-red);
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="repair-container">
    <div class="repair-label">
      <span id="label-text">REPARATION</span>
      <span id="percent-text" style="margin-left: auto; color: rgba(255,255,255,0.5)">0%</span>
    </div>
    <div class="repair-bar-bg">
      <div id="genProgress" class="repair-bar-fill"></div>
    </div>
  </div>

  <div class="qte-wrapper" id="qteWrapper">
    <div class="feedback" id="feedback">EXCELLENT</div>
    <div class="qte-circle"></div>
    <svg class="qte-svg">
      <!-- Zone blanche vide (Good) -->
      <circle class="zone-good" cx="90" cy="90" r="84" id="svgGood" stroke-dasharray="40 527" stroke-dashoffset="0"></circle>
      <!-- Zone blanche pleine (Great) -->
      <circle class="zone-great" cx="90" cy="90" r="84" id="svgGreat" stroke-dasharray="10 527" stroke-dashoffset="0"></circle>
    </svg>
    <div class="needle" id="needle"></div>
    <div class="qte-center">SPACE</div>
  </div>

  <div class="controls">
    <button id="startBtn">COMMENCER LA RÉPARATION</button>
  </div>

  <script>
    const state = {
      progress: 0,
      isRunning: false,
      isQteActive: false,
      needleRotation: 0,
      qteZones: { start: 0, greatEnd: 0, goodEnd: 0 },
      circumference: 2 * Math.PI * 84 // env 527
    };

    const elements = {
      progressFill: document.getElementById('genProgress'),
      percentText: document.getElementById('percent-text'),
      qteWrapper: document.getElementById('qteWrapper'),
      needle: document.getElementById('needle'),
      svgGood: document.getElementById('svgGood'),
      svgGreat: document.getElementById('svgGreat'),
      feedback: document.getElementById('feedback'),
      startBtn: document.getElementById('startBtn')
    };

    function startRepair() {
      state.isRunning = true;
      elements.startBtn.style.display = 'none';
      requestAnimationFrame(updateLoop);
      scheduleNextQTE();
    }

    function updateLoop() {
      if (!state.isRunning) return;

      // Progression lente (env 90s pour 100%)
      state.progress += 0.05;
      elements.progressFill.style.width = Math.min(state.progress, 100) + '%';
      elements.percentText.innerText = Math.floor(state.progress) + '%';

      if (state.isQteActive) {
        state.needleRotation += 4; // Vitesse de l'aiguille
        elements.needle.style.transform = `rotate(${state.needleRotation}deg)`;

        if (state.needleRotation > 360) {
          failQTE();
        }
      }

      if (state.progress < 100) {
        requestAnimationFrame(updateLoop);
      } else {
        finishGen();
      }
    }

    function scheduleNextQTE() {
      if (!state.isRunning) return;
      const delay = 3000 + Math.random() * 5000;
      setTimeout(triggerQTE, delay);
    }

    function triggerQTE() {
      if (!state.isRunning || state.isQteActive) return;

      // Reset aiguille
      state.needleRotation = 0;
      
      // Définir les zones (entre 60° et 300° pour éviter le haut)
      const startAngle = 60 + Math.random() * 200;
      const greatSize = 8; // Petit zone pleine
      const goodSize = 35; // Zone vide plus large

      state.qteZones = {
        start: startAngle,
        greatEnd: startAngle + greatSize,
        goodEnd: startAngle + goodSize
      };

      // Update SVG
      const offset = -startAngle; // Rotation inverse car SVG commence à 3h
      elements.svgGood.style.strokeDashoffset = (offset / 360) * state.circumference;
      elements.svgGood.style.strokeDasharray = `${(goodSize / 360) * state.circumference} ${state.circumference}`;
      
      elements.svgGreat.style.strokeDashoffset = (offset / 360) * state.circumference;
      elements.svgGreat.style.strokeDasharray = `${(greatSize / 360) * state.circumference} ${state.circumference}`;

      state.isQteActive = true;
      elements.qteWrapper.classList.add('active');
    }

    function handleInput() {
      if (!state.isQteActive) return;

      const hit = state.needleRotation;
      if (hit >= state.qteZones.start && hit <= state.qteZones.greatEnd) {
        successQTE('EXCELLENT', 'white');
        state.progress += 2; // Bonus
      } else if (hit > state.qteZones.greatEnd && hit <= state.qteZones.goodEnd) {
        successQTE('BON', '#ccc');
      } else {
        failQTE();
      }
    }

    function successQTE(text, color) {
      showFeedback(text, color);
      endQTE();
    }

    function failQTE() {
      showFeedback('RATÉ !', 'red');
      state.progress = Math.max(0, state.progress - 5); // Pénalité
      // Animation flash rouge
      elements.progressFill.style.background = 'white';
      setTimeout(() => elements.progressFill.style.background = '', 200);
      endQTE();
    }

    function endQTE() {
      state.isQteActive = false;
      elements.qteWrapper.classList.remove('active');
      scheduleNextQTE();
    }

    function showFeedback(text, color) {
      elements.feedback.innerText = text;
      elements.feedback.style.color = color;
      elements.feedback.classList.remove('show');
      void elements.feedback.offsetWidth; // Trigger reflow
      elements.feedback.classList.add('show');
    }

    function finishGen() {
      state.isRunning = false;
      alert("Générateur réparé !");
      location.reload();
    }

    // Events
    elements.startBtn.addEventListener('click', startRepair);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        handleInput();
      }
    });
  </script>
</body>
</html>
