<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu QTE - Rhythm Game</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --text-color: #eee;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --accent-red: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            width: 600px;
            text-align: center;
        }

        /* Gauge Section */
        .gauge-section {
            margin-bottom: 30px;
        }

        #genVisual {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-green) 0%, var(--bg-color) 0%);
            margin: 0 auto 15px;
            position: relative;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        #genVisual::before {
            content: '';
            position: absolute;
            inset: 15px;
            background: var(--bg-color);
            border-radius: 50%;
        }

        #genVisual.explode {
            transform: scale(1.2);
            filter: brightness(2) drop-shadow(0 0 30px var(--accent-red));
        }

        /* QTE Section */
        .qte-section {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto;
        }

        #qteContainer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
        }

        .qte-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            stroke-width: 8px;
            fill: none;
            transform: rotate(-90deg);
        }

        #qteShrink {
            stroke: var(--accent-green);
            opacity: 1;
        }

        #qteNormalZone, #qteGreatZone {
            stroke-width: 6px;
            fill: none;
            opacity: 0.5;
        }

        #qteNormalZone { stroke: var(--accent-yellow); }
        #qteGreatZone { stroke: var(--accent-green); filter: brightness(1.3); }

        /* Feedback */
        .qte-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
        }

        .qte-feedback.flash {
            animation: feedbackFlash 0.6s ease-out forwards;
        }

        @keyframes feedbackFlash {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -80%) scale(1); opacity: 0; }
        }

        .qte-feedback.great { color: var(--accent-green); text-shadow: 0 0 20px var(--accent-green); }
        .qte-feedback.success { color: var(--accent-yellow); }
        .qte-feedback.fail { color: var(--accent-red); }

        /* Stats Panel */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.7; }

        /* Buttons */
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s ease;
        }

        #startBtn { background: var(--accent-green); color: #000; }
        #resetBtn { background: rgba(255,255,255,0.1); color: var(--text-color); }
        
        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Overlay */
        #endOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #endOverlay.hidden { display: none !important; }

        .overlay-content {
            background: var(--bg-color);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
        }

        /* Achievements */
        #achievementsPanel {
            margin-top: 20px;
            display: grid;
            gap: 8px;
        }

        .achievement-item {
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .achievement-item.unlocked {
            opacity: 1;
            background: rgba(74, 222, 128, 0.2);
            border-left: 3px solid var(--accent-green);
        }

        /* Responsive */
        @media (max-width: 650px) {
            .game-container { width: 90vw; }
            #genVisual { width: 150px; height: 150px; }
            .qte-section { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Gauge Section -->
        <section class="gauge-section">
            <h3>Gauge</h3>
            <div id="genVisual"></div>
            <p id="genText">Gauge: 0%</p>
        </section>

        <!-- QTE Section -->
        <section class="qte-section">
            <svg id="qteContainer" viewBox="0 0 250 250">
                <circle cx="125" cy="125" r="120" stroke="#333" stroke-width="4" fill="none"/>
                
                <!-- Hit Zones -->
                <circle id="qteNormalZone" cx="125" cy="125" r="80" 
                        stroke="var(--accent-yellow)" stroke-width="6" fill="none"/>
                <circle id="qteGreatZone" cx="125" cy="125" r="40" 
                        stroke="var(--accent-green)" stroke-width="6" fill="none"/>
                
                <!-- Shrinking Ring -->
                <circle id="qteShrink" cx="125" cy="125" r="120" 
                        stroke="var(--accent-green)" stroke-width="8" fill="none"
                        stroke-dasharray="754 754"/>
                
                <!-- Feedback -->
                <text id="qteFeedback" x="125" y="125" text-anchor="middle" 
                      dominant-baseline="middle" class="qte-feedback">READY</text>
            </svg>
        </section>

        <!-- Stats Panel -->
        <div class="stats-panel">
            <div class="stat-item">
                <span id="streakVal" class="stat-value">0</span>
                <span class="stat-label">Streak</span>
            </div>
            <div class="stat-item">
                <span id="scoreVal" class="stat-value">0</span>
                <span class="stat-label">Score</span>
            </div>
            <div class="stat-item">
                <span id="comboVal" class="stat-value">0</span>
                <span class="stat-label">Combo</span>
            </div>
        </div>

        <!-- Controls -->
        <div style="margin-top: 20px;">
            <button id="startBtn">▶ Start Game</button>
            <button id="resetBtn">↺ Reset</button>
        </div>

        <!-- Achievements Panel -->
        <div id="achievementsPanel"></div>
    </div>

    <!-- End Overlay -->
    <div id="endOverlay" class="hidden">
        <div class="overlay-content">
            <h2 id="endTitle">Game Over!</h2>
            <p id="endScore">Final Score: 0</p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        // ============================================
        // CONSTANTS - Now Properly Defined
        // ============================================
        const CONFIG = {
            GAUGE_MAX: 100,
            QTE_CIRC: 754,           // Circumference of r=120 circle (2*PI*120)
            QTE_SHRINK_MS: 3000,    // Time for ring to shrink completely
            REGRESSION_AMOUNT: 15,  // Gauge loss on miss
            QTE_APPROACH_MS: 4000,  // Time from spawn to hit zone
            
            ZONE_RADI: {             // Hit zone radii
                GREAT: 40,
                NORMAL: 80,
                OUTER: 120
            },
            
            REWARDS: {               // Gauge rewards per hit type
                GREAT: 15,
                SUCCESS: 8,
                FAIL: -15
            }
        };

        const HIT_TYPES = {
            GREAT: 'GREAT',
            SUCCESS: 'SUCCESS', 
            MISS: 'MISS'
        };

        // ============================================
        // GAME STATE
        // ============================================
        let gameState = {
            isRunning: false,
            gauge: 0,
            streak: 0,
            score: 0,
            combo: 0,
            
            qteActive: false,
            qteStartTime: 0,
            qteProgress: 0,
            
            nextQTEAt: null,
            animationFrame: null,
            
            achievements: []
        };

        // ============================================
        // DOM ELEMENTS - Cached References
        // ============================================
        const dom = {
            startBtn: document.getElementById('startBtn'),
            resetBtn: document.getElementById('resetBtn'),
            restartBtn: document.getElementById('restartBtn'),
            
            genVisual: document.getElementById('genVisual'),
            genText: document.getElementById('genText'),
            
            qteContainer: document.getElementById('qteContainer'),
            qteShrink: document.getElementById('qteShrink'),
            qteNormalZone: document.getElementById('qteNormalZone'),
            qteGreatZone: document.getElementById('greatZone'),
            qteFeedback: document.getElementById('qteFeedback'),
            
            streakVal: document.getElementById('streakVal'),
            scoreVal: document.getElementById('scoreVal'),
            comboVal: document.getElementById('comboVal'),
            
            endOverlay: document.getElementById('endOverlay'),
            endTitle: document.getElementById('endTitle'),
            endScore: document.getElementById('endScore'),
            
            achievementsPanel: document.getElementById('achievementsPanel')
        };

        // ============================================
        // AUDIO SYSTEM
        // ============================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type, frequency = 440, duration = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type === HIT_TYPES.GREAT ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // ============================================
        // GAME LOGIC - Fixed & Complete
        // ============================================
        
        function initGame() {
            gameState = {
                isRunning: false,
                gauge: 0,
                streak: 0,
                score: 0,
                combo: 0,
                qteActive: false,
                qteStartTime: 0,
                qteProgress: 0,
                nextQTEAt: null,
                animationFrame: null,
                achievements: []
            };
            
            updateUI();
            resetQTEVisuals();
        }

        function startGame() {
            initGame();
            gameState.isRunning = true;
            scheduleNextQTE(1000); // First QTE after 1 second
            
            dom.startBtn.disabled = true;
            dom.resetBtn.disabled = false;
            
            updateUI();
        }

        function endGame(reason) {
            gameState.isRunning = false;
            cancelAnimationFrame(gameState.animationFrame);
            
            dom.endOverlay.classList.remove('hidden');
            dom.endTitle.textContent = reason === 'victory' ? 
                '🎉 GAUGE EXPLODED! VICTORY!' : 
                '💔 GAME OVER';
            dom.endScore.textContent = `Final Score: ${gameState.score}`;
            
            dom.startBtn.disabled = false;
        }

        function scheduleNextQTE(delay) {
            if (!gameState.isRunning) return;
            
            gameState.nextQTEAt = performance.now() + delay;
            
            // Spawn QTE when time arrives
            const checkSpawn = () => {
                if (performance.now() >= gameState.nextQTEAt && !gameState.qteActive) {
                    spawnQTE();
                } else {
                    gameState.animationFrame = requestAnimationFrame(checkSpawn);
                }
            };
            
            gameState.animationFrame = requestAnimationFrame(checkSpawn);
        }

        function spawnQTE() {
            if (!gameState.isRunning) return;
            
            gameState.qteActive = true;
            gameState.qteStartTime = performance.now();
            gameState.qteProgress = 0;
            
            // Visual setup for QTE
            dom.qteShrink.style.strokeDasharray = `${CONFIG.QTE_CIRC} ${CONFIG.QTE_CIRC}`;
            dom.qteFeedback.textContent = 'READY';
            dom.qteNormalZone.style.opacity = '1';
            dom.qteGreatZone.style.opacity = '1';
            
            // Start shrinking animation
            animateQTE();
        }

        function animateQTE() {
            if (!gameState.isRunning || !gameState.qteActive) return;
            
            const elapsed = performance.now() - gameState.qteStartTime;
            gameState.qteProgress = Math.min(elapsed / CONFIG.QTE_SHRINK_MS, 1);
            
            // Update shrinking ring visual
            const dashOffset = CONFIG.QTE_CIRC * gameState.qteProgress;
            dom.qteShrink.style.strokeDashoffset = dashOffset;
            
            if (gameState.qteProgress >= 1) {
                handleQTEMiss();
            } else {
                gameState.animationFrame = requestAnimationFrame(animateQTE);
            }
        }

        function processHit(hitType) {
            if (!gameState.isRunning || !gameState.qteActive) return;
            
            const elapsed = performance.now() - gameState.qteStartTime;
            const progress = elapsed / CONFIG.QTE_SHRINK_MS;
            
            // Determine actual hit quality based on timing
            let actualHitType;
            if (progress < 0.15) {
                actualHitType = HIT_TYPES.GREAT;
            } else if (progress < 0.45) {
                actualHitType = HIT_TYPES.SUCCESS;
            } else {
                actualHitType = HIT_TYPES.MISS;
            }
            
            applyHitResult(actualHitType);
        }

        function handleQTEMiss() {
            applyHitResult(HIT_TYPES.MISS);
        }

        function applyHitResult(hitType) {
            gameState.qteActive = false;
            cancelAnimationFrame(gameState.animationFrame);
            
            // Update gauge based on hit type
            const reward = CONFIG.REWARDS[hitType];
            gameState.gauge = Math.max(0, Math.min(CONFIG.GAUGE_MAX, gameState.gauge + reward));
            
            // Update streak and combo
            if (hitType === HIT_TYPES.MISS) {
                gameState.streak = 0;
                gameState.combo = 0;
            } else {
                gameState.streak++;
                gameState.combo += hitType === HIT_TYPES.GREAT ? 2 : 1;
                
                // Score calculation
                const baseScore = hitType === HIT_TYPES.GREAT ? 500 : 200;
                gameState.score += baseScore * (1 + gameState.streak * 0.1);
            }
            
            // Visual feedback
            dom.qteFeedback.textContent = hitType;
            dom.qteFeedback.style.color = 
                hitType === HIT_TYPES.GREAT ? 'var(--accent-green)' :
                hitType === HIT_TYPES.SUCCESS ? 'var(--accent-yellow)' : '#ff4444';
            
            // Audio feedback
            if (hitType !== HIT_TYPES.MISS) {
                playSound(hitType, 
                    hitType === HIT_TYPES.GREAT ? 880 : 660);
            } else {
                playSound(HIT_TYPES.MISS, 220, 0.3);
            }
            
            // Check for game end conditions
            if (gameState.gauge >= CONFIG.GAUGE_MAX) {
                endGame('victory');
                return;
            } else if (gameState.streak === 0 && gameState.gauge <= 0) {
                endGame('defeat');
                return;
            }
            
            // Schedule next QTE
            scheduleNextQTE(800 + Math.random() * 400);
        }

        function updateUI() {
            // Gauge display
            const gaugePercent = (gameState.gauge / CONFIG.GAUGE_MAX) * 100;
            dom.genVisual.style.width = `${gaugePercent}%`;
            dom.genText.textContent = `Gauge: ${Math.round(gameState.gauge)}%`;
            
            // Stats display
            dom.streakVal.textContent = gameState.streak;
            dom.scoreVal.textContent = Math.round(gameState.score);
            dom.comboVal.textContent = gameState.combo;
        }

        function resetQTEVisuals() {
            dom.qteShrink.style.strokeDasharray = `${CONFIG.QTE_CIRC} ${CONFIG.QTE_CIRC}`;
            dom.qteShrink.style.strokeDashoffset = '0';
            dom.qteFeedback.textContent = 'READY';
            dom.qteNormalZone.style.opacity = '1';
            dom.qteGreatZone.style.opacity = '1';
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        
        // Input handling - Spacebar for QTE hits
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameState.isRunning) {
                e.preventDefault();
                processHit(HIT_TYPES.SUCCESS);
            }
        });

        dom.startBtn.addEventListener('click', startGame);
        
        dom.resetBtn.addEventListener('click', () => {
            cancelAnimationFrame(gameState.animationFrame);
            initGame();
            dom.endOverlay.classList.add('hidden');
        });
        
        dom.restartBtn.addEventListener('click', () => {
            dom.endOverlay.classList.add('hidden');
            startGame();
        });

        // Initialize on load
        initGame();
    </script>
</body>
</html>
