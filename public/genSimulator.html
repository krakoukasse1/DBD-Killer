<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBD Gen Sim - Fidèle au jeu</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --dbd-red: #ff0000;
      --qte-size: 200px;
    }

    body {
      margin: 0;
      background-color: #050505;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ══ BARRE DE RÉPARATION (90s Progress) ══ */
    .repair-container {
      width: 450px;
      margin-bottom: 60px;
    }

    .repair-label {
      font-size: 1.3rem;
      letter-spacing: 3px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      color: #aaa;
    }

    .repair-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(40, 40, 40, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .repair-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #800, var(--dbd-red));
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
    }

    /* ══ SKILL CHECK (QTE) ══ */
    .qte-wrapper {
      position: relative;
      width: var(--qte-size);
      height: var(--qte-size);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .qte-wrapper.active { 
        visibility: visible; 
        opacity: 1;
    }

    .qte-circle-base {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      box-sizing: border-box;
    }

    .qte-svg {
      position: absolute;
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    /* Zone BON (Bordure blanche, fond noir) */
    .zone-good-border { fill: none; stroke: white; stroke-width: 12; }
    .zone-good-bg { fill: none; stroke: #050505; stroke-width: 8; }

    /* Zone EXCELLENT (Pleine blanche) */
    .zone-excellent { fill: none; stroke: white; stroke-width: 12; }

    .needle {
      position: absolute;
      width: 3px;
      height: 50%;
      background: var(--dbd-red);
      bottom: 50%;
      left: calc(50% - 1.5px);
      transform-origin: bottom center;
      z-index: 20;
      box-shadow: 0 0 10px red;
    }

    .qte-center {
      width: 80px;
      height: 40px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      font-size: 1.4rem;
      z-index: 30;
    }

    .feedback {
      position: absolute;
      top: -50px;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 2px 2px 4px black;
      pointer-events: none;
      opacity: 0;
    }

    .feedback.show { animation: popFeedback 0.6s ease-out; }

    @keyframes popFeedback {
      0% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: translateY(-30px); }
    }

    .start-btn {
      padding: 15px 40px;
      font-family: 'Bebas Neue';
      font-size: 1.8rem;
      background: transparent;
      color: white;
      border: 2px solid white;
      cursor: pointer;
      transition: 0.3s;
    }
    .start-btn:hover { background: white; color: black; }
  </style>
</head>
<body>

  <div class="repair-container">
    <div class="repair-label">
      <span>RÉPARATION EN COURS...</span>
      <span id="percentText">0%</span>
    </div>
    <div class="repair-bar-bg">
      <div id="genProgress" class="repair-bar-fill"></div>
    </div>
  </div>

  <div class="qte-wrapper" id="qteWrapper">
    <div class="feedback" id="feedback">EXCELLENT</div>
    <div class="qte-circle-base"></div>
    <svg class="qte-svg" viewBox="0 0 200 200">
      <!-- Zone GOOD (Bordure) -->
      <circle class="zone-good-border" cx="100" cy="100" r="90" id="svgGoodBorder" stroke-dasharray="40 565" stroke-dashoffset="0"></circle>
      <!-- Zone GOOD (Intérieur noir pour l'effet "hollow") -->
      <circle class="zone-good-bg" cx="100" cy="100" r="90" id="svgGoodBg" stroke-dasharray="38 565" stroke-dashoffset="0"></circle>
      <!-- Zone EXCELLENT (Pleine) -->
      <circle class="zone-excellent" cx="100" cy="100" r="90" id="svgExcellent" stroke-dasharray="10 565" stroke-dashoffset="0"></circle>
    </svg>
    <div class="needle" id="needle"></div>
    <div class="qte-center">SPACE</div>
  </div>

  <button class="start-btn" id="startBtn">RÉPARER LE GÉNÉRATEUR</button>

  <script>
    const settings = {
      repairTimeSeconds: 90,
      fps: 60,
      needleSpeed: 2.2, // Plus lent et gérable
      circumference: 2 * Math.PI * 90 // ~565
    };

    const state = {
      progress: 0,
      isRunning: false,
      isQteActive: false,
      needleRot: 0,
      zones: { start: 0, excellentEnd: 0, goodEnd: 0 }
    };

    const el = {
      bar: document.getElementById('genProgress'),
      percent: document.getElementById('percentText'),
      qte: document.getElementById('qteWrapper'),
      needle: document.getElementById('needle'),
      svgGoodBorder: document.getElementById('svgGoodBorder'),
      svgGoodBg: document.getElementById('svgGoodBg'),
      svgExcellent: document.getElementById('svgExcellent'),
      feedback: document.getElementById('feedback'),
      btn: document.getElementById('startBtn')
    };

    function start() {
      state.isRunning = true;
      el.btn.style.display = 'none';
      requestAnimationFrame(update);
      scheduleQTE();
    }

    function update() {
      if (!state.isRunning) return;

      // Calcul de la progression pour 90s
      // $100 / (90s * 60fps)$
      state.progress += (100 / (settings.repairTimeSeconds * settings.fps));
      el.bar.style.width = Math.min(state.progress, 100) + '%';
      el.percent.innerText = Math.floor(state.progress) + '%';

      if (state.isQteActive) {
        state.needleRot += settings.needleSpeed;
        el.needle.style.transform = `rotate(${state.needleRot}deg)`;

        if (state.needleRot > 360) fail();
      }

      if (state.progress < 100) {
        requestAnimationFrame(update);
      } else {
        victory();
      }
    }

    function triggerQTE() {
      if (!state.isRunning || state.isQteActive) return;

      state.needleRot = 0;
      const startAngle = 80 + Math.random() * 180;
      const excSize = 10; 
      const goodSize = 45;

      state.zones = {
        start: startAngle,
        excEnd: startAngle + excSize,
        goodEnd: startAngle + goodSize
      };

      const offset = -startAngle;
      const dash = (s) => `${(s / 360) * settings.circumference} ${settings.circumference}`;
      const off = (a) => (a / 360) * settings.circumference;

      el.svgExcellent.style.strokeDasharray = dash(excSize);
      el.svgExcellent.style.strokeDashoffset = off(offset);

      el.svgGoodBorder.style.strokeDasharray = dash(goodSize);
      el.svgGoodBorder.style.strokeDashoffset = off(offset);

      el.svgGoodBg.style.strokeDasharray = dash(goodSize - 2);
      el.svgGoodBg.style.strokeDashoffset = off(offset - 1);

      state.isQteActive = true;
      el.qte.classList.add('active');
    }

    function checkInput() {
      if (!state.isQteActive) return;
      
      const hit = state.needleRot;
      if (hit >= state.zones.start && hit <= state.zones.excEnd) {
        success("EXCELLENT !", "white", 3);
      } else if (hit > state.zones.excEnd && hit <= state.zones.goodEnd) {
        success("BON", "#ddd", 0);
      } else {
        fail();
      }
    }

    function success(txt, color, bonus) {
      showFeedback(txt, color);
      state.progress = Math.min(100, state.progress + bonus);
      stopQTE();
    }

    function fail() {
      showFeedback("RATÉ !", "red");
      state.progress = Math.max(0, state.progress - 5);
      el.bar.style.backgroundColor = "white";
      setTimeout(() => el.bar.style.backgroundColor = "", 150);
      stopQTE();
    }

    function stopQTE() {
      state.isQteActive = false;
      el.qte.classList.remove('active');
      scheduleQTE();
    }

    function scheduleQTE() {
      setTimeout(() => { if(state.isRunning) triggerQTE(); }, 4000 + Math.random() * 6000);
    }

    function showFeedback(txt, color) {
      el.feedback.innerText = txt;
      el.feedback.style.color = color;
      el.feedback.classList.remove('show');
      void el.feedback.offsetWidth;
      el.feedback.classList.add('show');
    }

    function victory() {
      state.isRunning = false;
      alert("Générateur complété ! Le portail est ouvert.");
      location.reload();
    }

    el.btn.addEventListener('click', start);
    window.addEventListener('keydown', (e) => { if(e.code === 'Space') { e.preventDefault(); checkInput(); }});
  </script>
</body>
</html>
