<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBD Roulette</title>
<link rel="stylesheet" href="style.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: linear-gradient(rgba(12, 13, 15, 0.75), rgba(12, 13, 15, 0.75)), url('assets/logo/bg_repairmg1.png') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Arial Narrow", Arial, sans-serif;
    gap: 40px;
    user-select: none;
    overflow: hidden;
  }

  /* STYLES DU HEADER TRANSMIS */
  header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background-color: rgba(12, 13, 15, 0.9);
    border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    z-index: 1000;
  }
  .header-left { display: flex; align-items: center; gap: 15px; }
  .header-left .img-logo { height: 45px; width: auto; }
  .header-left p { color: #fff; font-size: 22px; font-weight: bold; font-family: Arial, sans-serif; letter-spacing: 1px; }
  .menu-toggle { display: none; color: #fff; font-size: 28px; cursor: pointer; }
  .list-ul { display: flex; align-items: center; list-style: none; gap: 20px; }
  .list-li a { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 15px; font-weight: bold; transition: color 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
  .list-li a:hover { color: #fff; }
  .twitch-button { display: flex; align-items: center; gap: 8px; background-color: #6441a5; padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; }
  .twitch-button:hover { background-color: #7d5bbe; }
  .twitch-icon { height: 18px; width: auto; }
  .twitch-button span { color: #fff; font-size: 14px; font-weight: bold; }

  /* INFO ZONE AUDIO */
  .audio-info { position: fixed; top: 90px; font-size: 12px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; z-index: 10; }

  /* IMAGE PRINCIPALE AU MILIEU */
  .main-logo-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    pointer-events: none;
  }
  .main-logo {
    width: 320px;
    height: auto;
    opacity: 0.85;
    filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.8));
  }

  /* BARRE DE REPARATION */
  .hud { position: fixed; bottom: 98px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; user-select: none; z-index: 10; }
  .bar-block { position: relative; display: flex; flex-direction: column; }
  .repair-text { position: absolute; top: -16px; left: 2px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(210,208,200,0.7); text-shadow: 0 1px 3px rgba(0,0,0,0.95); white-space: nowrap; }
  .dbd-bar-outer { position: relative; width: 380px; height: 16px; border-radius: 2px; background: linear-gradient(180deg, #18191d 0%, #0c0d0f 28%, #0c0d0f 72%, #20222a 100%); box-shadow: inset 0 2px 4px rgba(0,0,0,0.95), inset 0 -1px 2px rgba(255,255,255,0.03), 0 3px 12px rgba(0,0,0,0.8); overflow: hidden; }
  .dbd-bar-outer::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent 0px, transparent 3px, rgba(255,255,255,0.013) 3px, rgba(255,255,255,0.013) 4px); pointer-events: none; z-index: 1; }
  .dbd-bar-fill { position: absolute; top: 0; left: 0; bottom: 0; width: 0%; transition: width 0.04s linear; overflow: hidden; border-radius: 1px; z-index: 2; }
  .dbd-bar-fill-inner { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(70,75,80,0.55) 0%, rgba(105,110,115,0.7) 16%, rgba(155,160,163,0.88) 30%, rgba(215,220,225,0.97) 43%, rgba(255,255,255,1) 50%, rgba(215,220,225,0.97) 57%, rgba(155,160,163,0.88) 70%, rgba(105,110,115,0.7) 84%, rgba(55,60,65,0.5) 100%); box-shadow: 0 0 7px 2px rgba(190,205,220,0.35); }
  .dbd-bar-fill-inner::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 8px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55)); }
  .dbd-bar-fill.regressing .dbd-bar-fill-inner { background: linear-gradient(180deg, #440, #ff6600); box-shadow: 0 0 14px rgba(255,100,0,0.5); }
  .dbd-bar-bevel { position: absolute; inset: 0; pointer-events: none; z-index: 3; background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.05) 22%, transparent 40%, transparent 60%, rgba(0,0,0,0.05) 78%, rgba(0,0,0,0.4) 100%); border-radius: 2px; box-shadow: inset 2px 0 5px rgba(0,0,0,0.55), inset -2px 0 5px rgba(0,0,0,0.55); }

  /* SKILL CHECK */
  .sc-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.1s; z-index: 100; }
  .sc-overlay.visible { opacity: 1; pointer-events: all; }
  .sc-wrap { position: relative; width: 300px; height: 300px; background: radial-gradient(circle, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.4) 60%, transparent 100%); border-radius: 50%; }
  #scCanvas { position: absolute; inset: 0; width: 300px; height: 300px; }
  .sc-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: black; border: 3px solid white; border-radius: 6px; color: white; font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; letter-spacing: 3px; padding: 12px 30px; user-select: none; }

  /* RESULT NOTIFICATION style DBD */
  .sc-notif {
    position: fixed;
    top: 100px; right: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: none;
    padding: 0;
    pointer-events: none;
    opacity: 0;
    transform: translateX(20px);
    transition: opacity 0.18s, transform 0.18s;
    z-index: 200;
    min-width: 280px;
  }
  .sc-notif.show { opacity: 1; transform: translateX(0); }

  .sc-notif-text { display: flex; flex-direction: column; flex: 1; gap: 0; text-align: right; }
  .sc-notif-label {
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(210,205,195,0.92);
    white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  }
  .sc-notif-label .great { color: #f5d84a; }
  .sc-notif-label .good  { color: #d4cdb8; }
  .sc-notif-label .miss  { color: #c04030; }

  .sc-notif-points-row {
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    white-space: nowrap;
    line-height: 1;
  }
  .sc-notif-spacer { visibility: hidden; letter-spacing: 1.2px; }
  .sc-notif-points { color: #c0392b; text-shadow: 0 1px 4px rgba(0,0,0,0.9); font-size: 12px; letter-spacing: 1px; }

  /* CERCLE DE SCORE + INTEGRATION LOGO SKILLCHECK */
  .sc-notif-circle { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .sc-notif-circle canvas { position: absolute; inset: 0; z-index: 2; }
  
  /* L'icône wrap est maintenant centrée parfaitement AU MILIEU du cercle */
  .sc-notif-icon-wrap { 
    position: absolute;
    inset: 0;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    z-index: 1; 
  }
  .sc-notif-icon { width: 60%; height: auto; opacity: 0.8; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); }

  /* COMPTEUR GÉNÉRATEURS - AGRANDI 2X A 3X */
  .gen-counter { position: fixed; bottom: 32px; left: 40px; display: flex; align-items: center; gap: 20px; pointer-events: none; z-index: 50; }
  .gen-icon-wrap { width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; } /* 2.5x plus grand */
  .gen-icon { width: 100%; height: auto; opacity: 0.95; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.9)); }
  .gen-count-text { font-family: Arial, sans-serif; font-size: 130px; font-weight: bold; color: rgba(240,235,220,0.95); text-shadow: 0 4px 15px rgba(0,0,0,0.95); letter-spacing: 1px; line-height: 0.8; } /* 2.5x plus grand */
</style>
</head>
<body>

<header>
  <div class="header-left">
    <img class="img-logo" src="assets/dbd logo.png" alt="Logo">
    <p>Roulette DBD</p>
  </div>
  <div class="menu-toggle">☰</div>
  <ul class="list-ul">
    <li class="list-li"><a href="index.html">Accueil</a></li>
    <li class="list-li"><a href="characterList.html?type=Killer">Liste tueurs</a></li>
    <li class="list-li"><a href="characterList.html?type=Survivor">Liste survivants</a></li>
    <li class="list-li"><a href="perkRoulette.html">Roulette perks</a></li>
    <li class="list-li"><a href="mapsRoulette.html">Roulette maps</a></li>
    <li class="list-li"><a href="bonus.html">Bonus</a></li>
    <li class="list-li" id="profile-link" style="display:none"><a href="profile.html">Mon profil</a></li>
    <li class="list-li">
      <div id="twitch-btn" class="twitch-button">
        <img src="assets/twitch_logo.png" class="twitch-icon" alt="Twitch">
        <span>Connexion Twitch</span>
      </div>
    </li>
  </ul>
</header>

<div class="audio-info">Cliquez sur l'écran pour activer le son et lancer la réparation</div>

<div class="main-logo-container">
  <img src="assets/logo/generatorsmainimage.png" alt="Generator Main" class="main-logo">
</div>

<div class="hud">
  <div class="bar-block">
    <span class="repair-text">Repair</span>
    <div class="dbd-bar-outer">
      <div class="dbd-bar-fill" id="fill"><div class="dbd-bar-fill-inner"></div></div>
      <div class="dbd-bar-bevel"></div>
    </div>
  </div>
</div>

<div class="sc-overlay" id="scOverlay">
  <div class="sc-wrap">
    <canvas id="scCanvas" width="300" height="300"></canvas>
    <div class="sc-label">SPACE</div>
  </div>
</div>

<div class="sc-notif" id="scNotif">
  <div class="sc-notif-text">
    <div class="sc-notif-label">TEST D'HABILETÉ&nbsp;: <span id="notifWord"></span></div>
    <div class="sc-notif-points-row">
      <span class="sc-notif-spacer">TEST D'HABILETÉ&nbsp;: </span><span class="sc-notif-points" id="notifPoints"></span>
    </div>
  </div>
  <div class="sc-notif-circle">
    <div class="sc-notif-icon-wrap">
      <img src="assets/logo/skillcheck.png" alt="Icon" class="sc-notif-icon">
    </div>
    <canvas id="circleCanvas" width="56" height="56"></canvas>
  </div>
</div>

<div class="gen-counter" id="genCounter">
  <div class="gen-icon-wrap">
    <img src="assets/logo/generators.png" alt="Gen Icon" class="gen-icon">
  </div>
  <div class="gen-count-text" id="genCountText">5</div>
</div>

<script>
// ── SYSTÈME AUDIO EMBARQUÉ ──
const S = 'assets/sounds/';

const pistonAudios = [
  new Audio(S + 'Piston_Low.mp3'),
  new Audio(S + 'Piston_Medium.mp3'),
  new Audio(S + 'Piston_1Fast.mp3'),
  new Audio(S + 'Piston2_Fast.mp3'),
];

const cliquetis = [
  new Audio(S + 'Cliquet_Song.mp3'),
  new Audio(S + 'Cliquet_Song2.mp3'),
];

const sndStart  = new Audio(S + 'Generator_Starting.mp3');
const sndDone   = new Audio(S + 'gen_complete.mp3');
const sndQteIn  = new Audio(S + 'QTE_Entree.mp3');
const sndGreat  = new Audio(S + 'QTE_Parfait.mp3');
const sndGood   = new Audio(S + 'QTE_Good.mp3');
const sndFail   = new Audio(S + 'QTE_Failed.mp3');

pistonAudios.forEach(a => { a.loop = true; a.volume = 0; });
cliquetis.forEach(a => { a.volume = 0.5; });
sndStart.volume = 0.7; sndDone.volume = 0.9;
sndQteIn.volume = 0.6; sndGreat.volume = 0.7;
sndGood.volume  = 0.6; sndFail.volume  = 0.8;

let audioUnlocked = false;

function unlockAudioAndStart() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  document.querySelector('.audio-info').style.display = 'none';

  pistonAudios.forEach(a => { a.play().then(() => a.pause()).catch(() => {}); });
  
  sndStart.play().catch(() => {});
  running = true;
  savedElapsed = 0; 
  startTime = null;
  raf = requestAnimationFrame(tick);
}

function handleAudioLayers(pct) {
  if (!audioUnlocked) return;

  if (pct > 0) {
    pistonAudios[0].play().catch(() => {});
    pistonAudios[0].volume = 0.35;
    pistonAudios[0].playbackRate = 0.65 + (pct / 100) * 0.3;
  }
  if (pct >= 25) {
    pistonAudios[1].play().catch(() => {});
    pistonAudios[1].volume = 0.4;
    pistonAudios[1].playbackRate = 0.75 + ((pct - 25) / 75) * 0.2;
  }
  if (pct >= 50) {
    pistonAudios[2].play().catch(() => {});
    pistonAudios[2].volume = 0.45;
    pistonAudios[2].playbackRate = 0.85 + ((pct - 50) / 50) * 0.2;
  }
  if (pct >= 75) {
    pistonAudios[3].play().catch(() => {});
    pistonAudios[3].volume = 0.5;
    pistonAudios[3].playbackRate = 1.0;
  }

  if (Math.random() < 0.015) {
    let sound = cliquetis[Math.floor(Math.random() * cliquetis.length)];
    sound.play().catch(() => {});
  }
}

function killEngineSounds() {
  pistonAudios.forEach(a => { a.pause(); a.volume = 0; });
}

// ── SKILL CHECK CANVAS ORIGINAL ──
const canvas = document.getElementById("scCanvas");
const ctx    = canvas.getContext("2d");
const CX = 150, CY = 150, R = 120;
const GOOD_SIZE  = 40 * Math.PI / 180;
const GREAT_SIZE = 8  * Math.PI / 180;

const START_ANGLE = -Math.PI / 2;
let needleAngle  = START_ANGLE;
let successAngle = Math.PI * 1.7;
let scActive     = false;
let scRAF        = null;

function randomSuccessAngle() {
  const forbidden_start = START_ANGLE - 0.6;
  const forbidden_end   = START_ANGLE + Math.PI / 2 + GOOD_SIZE + 0.2;
  const range = (forbidden_start + Math.PI * 2) - forbidden_end - GOOD_SIZE - 0.1;
  successAngle = forbidden_end + Math.random() * range;
}

function drawSC() {
  ctx.clearRect(0, 0, 300, 300);

  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.strokeStyle = "#d7d7d7";
  ctx.lineWidth   = 8;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(CX, CY, R - 8, 0, Math.PI * 2);
  ctx.strokeStyle = "#121212";
  ctx.lineWidth   = 8;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(CX, CY, R, successAngle, successAngle + GOOD_SIZE);
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth   = 14;
  ctx.lineCap     = "round";
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(CX, CY, R, successAngle, successAngle + GOOD_SIZE);
  ctx.strokeStyle = "#3d3d3d";
  ctx.lineWidth   = 8;
  ctx.lineCap     = "round";
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(CX, CY, R, successAngle, successAngle + GREAT_SIZE);
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth   = 10;
  ctx.lineCap     = "round";
  ctx.stroke();

  const innerR = 55, outerR = R + 35;
  ctx.beginPath();
  ctx.moveTo(CX + innerR * Math.cos(needleAngle), CY + innerR * Math.sin(needleAngle));
  ctx.lineTo(CX + outerR * Math.cos(needleAngle), CY + outerR * Math.sin(needleAngle));
  ctx.strokeStyle = "#ff1200";
  ctx.lineWidth   = 3;
  ctx.lineCap     = "round";
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(CX, CY, 5, 0, Math.PI * 2);
  ctx.fillStyle = "#111";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(CX, CY, 3, 0, Math.PI * 2);
  ctx.fillStyle = "#ddd";
  ctx.fill();
}

function animateSC() {
  needleAngle += 0.025;
  if (needleAngle >= START_ANGLE + Math.PI * 2) {
    hideSC();
    showResult('miss');
    triggerPenalty();
    resumeTickAfterQTE();
    return;
  }
  drawSC();
  if (scActive) scRAF = requestAnimationFrame(animateSC);
}

function showSC() {
  sndQteIn.play().catch(() => {});
  randomSuccessAngle();
  needleAngle = START_ANGLE;
  scActive    = true;
  document.getElementById('scOverlay').classList.add('visible');
  scRAF = requestAnimationFrame(animateSC);
}

function hideSC() {
  scActive = false;
  cancelAnimationFrame(scRAF);
  document.getElementById('scOverlay').classList.remove('visible');
  ctx.clearRect(0, 0, 300, 300);
}

function checkHit() {
  if (!scActive) return;
  const a = ((needleAngle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const s = ((successAngle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const diff = ((a - s) + Math.PI*2) % (Math.PI*2);
  const isGreat = diff >= 0 && diff <= GREAT_SIZE;
  const isGood  = diff >= 0 && diff <= GOOD_SIZE;
  
  hideSC();
  if (isGreat) {
    sndGreat.play().catch(() => {});
    showResult('great');
  } else if (isGood) {
    sndGood.play().catch(() => {});
    showResult('good');
  } else {
    showResult('miss');
    triggerPenalty();
  }
  
  resumeTickAfterQTE();
}

function triggerPenalty() {
  sndFail.play().catch(() => {});
  savedElapsed = Math.max(0, elapsed - TOTAL_MS * 0.15);
  elapsed = savedElapsed;
  setProgress((elapsed / TOTAL_MS) * 100);
  
  fill.classList.add('regressing');
  setTimeout(() => fill.classList.remove('regressing'), 600);
}

function resumeTickAfterQTE() {
  setTimeout(() => {
    if (!running && gensLeft > 0) { 
      running = true; 
      startTime = null; 
      raf = requestAnimationFrame(tick); 
    }
  }, 600);
}

// SCORE ET CERLES DE NOTIFICATIONS
let totalScore   = 0;
const MAX_SCORE  = 5000;

function drawCircle(ratio) {
  const c    = document.getElementById('circleCanvas');
  const cctx = c.getContext('2d');
  const cx = 28, cy = 28, r = 24; // Ajustement taille par rapport au cercle 56px
  cctx.clearRect(0, 0, 56, 56);

  cctx.beginPath();
  cctx.arc(cx, cy, r, 0, Math.PI * 2);
  cctx.strokeStyle = 'rgba(80,80,80,0.4)';
  cctx.lineWidth = 4;
  cctx.stroke();

  if (ratio > 0) {
    cctx.beginPath();
    cctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + ratio * Math.PI * 2);
    cctx.strokeStyle = '#c0392b';
    cctx.lineWidth = 4;
    cctx.lineCap = 'round';
    cctx.stroke();
  }
}

function showResult(type) {
  const notif  = document.getElementById('scNotif');
  const word   = document.getElementById('notifWord');
  const points = document.getElementById('notifPoints');

  const labels = { great: 'EXCELLENT', good: 'GOOD', miss: 'MANQUÉ' };
  const pts    = { great: 300, good: 100, miss: 0 };

  word.innerHTML = `<span class="${type}">${labels[type]}</span>`;

  const gained = pts[type];
  points.textContent = gained > 0 ? '+' + gained : '';

  totalScore = Math.min(MAX_SCORE, totalScore + gained);
  drawCircle(totalScore / MAX_SCORE);

  notif.classList.add('show');
  setTimeout(() => notif.classList.remove('show'), 2000);
}

// ── COMPTEUR GÉNÉRATEURS ──
let gensLeft = 5;
function repairGen() {
  if (gensLeft <= 0) return;
  gensLeft--;
  document.getElementById('genCountText').textContent = gensLeft;
}

// ── BARRE DE REPARATION PRINCIPALE ──
const TOTAL_MS       = 90000;
const SC_INTERVAL_MS = 4000;
const fill     = document.getElementById('fill');
let startTime = null, savedElapsed = 0, elapsed = 0, running = false, raf = null;
let lastSCTime = 0;

function setProgress(pct) { fill.style.width = pct + '%'; }

function tick(ts) {
  if (!startTime) startTime = ts;
  elapsed = (ts - startTime) + savedElapsed;
  const pct = Math.min((elapsed / TOTAL_MS) * 100, 100);
  setProgress(pct);
  handleAudioLayers(pct);

  if (elapsed - lastSCTime >= SC_INTERVAL_MS && elapsed > 500) {
    lastSCTime = elapsed;
    running = false;
    savedElapsed = elapsed;
    killEngineSounds();
    showSC();
    return;
  }

  if (pct >= 100) {
    running = false; 
    setProgress(100);
    killEngineSounds();
    sndDone.play().catch(() => {});
    repairGen();
    
    setTimeout(() => {
      if (gensLeft > 0) {
        elapsed = 0; savedElapsed = 0; startTime = null; lastSCTime = 0;
        setProgress(0);
        sndStart.play().catch(() => {});
        running = true;
        raf = requestAnimationFrame(tick);
      }
    }, 800);
    return;
  }
  if (running) raf = requestAnimationFrame(tick);
}

// INITIALISATEURS D'ÉVÉNEMENTS
window.addEventListener('click', e => {
  // Bloque l'activation globale de la simulation si on clique sur un lien du header
  if (e.target.closest('header')) return;
  unlockAudioAndStart();
});

window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    if (!audioUnlocked) {
      unlockAudioAndStart();
    } else if (scActive) {
      e.preventDefault(); 
      checkHit(); 
    }
  }
});
document.getElementById('scOverlay').addEventListener('click', () => { if (scActive) checkHit(); });

// Initialisation du cercle vide au chargement
drawCircle(0);
</script>

</body>
</html>
