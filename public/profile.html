<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Profil</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="header-left">
    <img class="img-logo" src="assets/dbd logo.png">
    <p>Profil</p>
  </div>
</header>

<main class="profile-container">

  <div class="profile-header">
    <img id="avatar" class="profile-avatar">
    <input id="username" disabled>
  </div>

  <div class="accordion">
    <h2 onclick="toggleSection('killer')">Killer ▼</h2>
    <div id="killer" class="section"></div>

    <h2 onclick="toggleSection('survivor')">Survivor ▼</h2>
    <div id="survivor" class="section"></div>
  </div>

  <div class="settings">
    <label>
      Mode Streamer
      <input type="checkbox" id="streamerMode">
    </label>

    <label>
      Mode Anonyme
      <input type="checkbox" id="anonymousMode">
    </label>
  </div>

  <button id="saveBtn">Enregistrer</button>

  <h3>Historique</h3>
  <table id="history">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Nom</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</main>

<script src="profile.js"></script>
</body>
</html>
