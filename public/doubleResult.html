<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage Double — DBD</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .result-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    /* HERO */
    .result-hero { text-align: center; }
    .result-hero h1 { font-size: clamp(2.5rem, 7vw, 5rem); color: #fff; letter-spacing: 4px; line-height: 0.9; margin-bottom: 8px; }
    .result-hero h1 span { color: #cc0000; }
    .result-hero p { font-family: sans-serif; font-size: 0.85rem; color: rgba(200,200,200,0.45); }

    /* CARTE PERSONNAGE */
    .character-card {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 28px 32px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      width: 100%;
      backdrop-filter: blur(8px);
      animation: slide-in 0.5s ease forwards;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .char-img {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid rgba(200,0,0,0.4);
      box-shadow: 0 0 30px rgba(200,0,0,0.2);
    }
    .char-info {}
    .char-label { font-family: sans-serif; font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(200,0,0,0.8); margin-bottom: 6px; display: block; }
    .char-name  { font-size: clamp(2rem, 5vw, 3.5rem); color: #fff; letter-spacing: 3px; line-height: 1; }
    .char-type  { font-family: sans-serif; font-size: 0.8rem; color: rgba(200,200,200,0.4); margin-top: 6px; letter-spacing: 1px; }

    /* SÉPARATEUR */
    .section-label {
      font-family: sans-serif;
      font-size: 0.65rem;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
    }
    .section-label::before,
    .section-label::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }

    /* PERKS */
    .perks-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }
    @media(max-width: 600px) { .perks-grid { grid-template-columns: 1fr; } }

    .perk-banner {
      display: grid;
      grid-template-columns: 70px 70px 1fr;
      gap: 16px;
      align-items: center;
      padding: 16px 18px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      opacity: 0;
      transform: translateX(-16px);
      transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.3s;
    }
    .perk-banner.visible { opacity: 1; transform: translateX(0); }
    .perk-banner:hover { border-color: rgba(255,255,255,0.16); }

    .perk-img-wrap {
      width: 70px; height: 70px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; flex-shrink: 0;
      overflow: hidden;
    }
    .perk-img-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }

    .char-img-wrap {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .char-img-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

    .perk-text {}
    .perk-name { font-size: 1rem; color: #fff; letter-spacing: 1.5px; margin-bottom: 3px; display: block; }
    .perk-origin { font-family: sans-serif; font-size: 0.65rem; color: rgba(200,200,200,0.35); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 7px; display: block; }
    .perk-origin.generic { color: rgba(255,180,0,0.5); }
    .perk-desc { font-family: sans-serif; font-size: 0.72rem; color: rgba(200,200,200,0.5); line-height: 1.5; }

    /* ACTIONS */
    .result-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .action-btn {
      padding: 13px 28px; border-radius: 9px;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px;
      cursor: pointer; transition: all .2s; border: none;
    }
    .action-btn.primary { background: red; color: #fff; }
    .action-btn.primary:hover { background: #cc0000; transform: scale(1.03); }
    .action-btn.secondary { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); color: rgba(255,255,255,.7); }
    .action-btn.secondary:hover { border-color: rgba(255,255,255,.35); color: #fff; }

    /* ══ ANIMATION ROULETTE ══ */
    .roulette-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Slot perso */
    .slot-char-wrap {
      position: relative;
      width: 100%;
      height: 160px;
      background: rgba(0,0,0,0.6);
      border: 2px solid rgba(200,0,0,0.4);
      border-radius: 12px;
      overflow: hidden;
    }
    .slot-char-wrap::before,
    .slot-char-wrap::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 15%;
      z-index: 3;
      pointer-events: none;
    }
    .slot-char-wrap::before { left: 0;  background: linear-gradient(to right, rgba(0,0,0,0.9), transparent); }
    .slot-char-wrap::after  { right: 0; background: linear-gradient(to left,  rgba(0,0,0,0.9), transparent); }

    .slot-char-line {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, transparent, #cc0000 20%, #cc0000 80%, transparent);
      box-shadow: 0 0 10px rgba(200,0,0,0.8);
      transform: translateX(-50%);
      z-index: 4;
    }

    .slot-char-track {
      display: flex;
      align-items: center;
      height: 100%;
      will-change: transform;
    }

    .slot-char-item {
      flex-shrink: 0;
      width: 160px;
      height: 140px;
      margin: 0 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      filter: brightness(0.5);
      transition: filter 0.3s;
    }
    .slot-char-item.winner { filter: brightness(1.1); }
    .slot-char-item img {
      width: 100px; height: 100px;
      border-radius: 10px; object-fit: cover;
      border: 2px solid rgba(255,255,255,0.1);
    }
    .slot-char-item span {
      font-size: 0.75rem; color: rgba(255,255,255,0.7);
      letter-spacing: 1px; text-align: center;
      max-width: 140px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    /* Slots perks (4 colonnes) */
    .slots-perks-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media(max-width:700px){ .slots-perks-row { grid-template-columns: repeat(2,1fr); } }

    .slot-perk-wrap {
      position: relative;
      height: 130px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
    }
    .slot-perk-wrap::before,
    .slot-perk-wrap::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      height: 25%;
      z-index: 3;
      pointer-events: none;
    }
    .slot-perk-wrap::before { top: 0;    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); }
    .slot-perk-wrap::after  { bottom: 0; background: linear-gradient(to top,    rgba(0,0,0,0.9), transparent); }

    .slot-perk-line {
      position: absolute;
      left: 0; right: 0;
      top: 50%; height: 2px;
      background: linear-gradient(to right, transparent, rgba(200,0,0,0.7), transparent);
      transform: translateY(-50%);
      z-index: 4;
    }

    .slot-perk-track {
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .slot-perk-item {
      flex-shrink: 0;
      width: 100%;
      height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      filter: brightness(0.45);
      transition: filter 0.3s;
    }
    .slot-perk-item.winner { filter: brightness(1.1); }
    .slot-perk-item .perk-slot-img {
      width: 56px; height: 56px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      overflow: hidden;
    }
    .slot-perk-item .perk-slot-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .slot-perk-item .perk-slot-name {
      font-size: 0.65rem; color: rgba(255,255,255,0.65);
      letter-spacing: 0.5px; text-align: center;
      max-width: 100%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; padding: 0 4px;
    }

    /* Résultats finaux */
    .final-results {
      display: none;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }
    .final-results.visible { display: flex; }

/* ══════════════════════════════
   RARETÉS — classes réutilisables
   (tueurs ET survivants)
══════════════════════════════ */
.rarity-bg {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background-size: cover;
  background-position: center;
  opacity: 0.25;
  z-index: 0;
}

/* Raretés survivant */
.rarity-Common        { background-image: url('assets/rarities/Common.png');     border-color: rgba(180,180,180,0.4) !important; }
.rarity-Uncommon      { background-image: url('assets/rarities/Uncommon.png');   border-color: rgba(80,200,80,0.5)   !important; }
.rarity-Rare          { background-image: url('assets/rarities/Rare.png');       border-color: rgba(80,120,255,0.5)  !important; }
.rarity-Very-Rare     { background-image: url('assets/rarities/VeryRare.png');   border-color: rgba(180,0,255,0.5)   !important; }
.rarity-Ultra-Rare    { background-image: url('assets/rarities/UltraRare.png');  border-color: rgba(255,140,0,0.6)   !important; }

/* Badge texte de rareté */
.item-rarity {
  display: inline-block;
  font-family: sans-serif;
  font-size: 0.62rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 2px 10px;
  border-radius: 10px;
  border: 1px solid;
  margin-bottom: 6px;
}
.item-rarity.rarity-Common     { color: rgba(200,200,200,0.9); background: rgba(180,180,180,0.1); border-color: rgba(180,180,180,0.3); }
.item-rarity.rarity-Uncommon   { color: rgba(80,220,80,0.9);   background: rgba(80,200,80,0.08);  border-color: rgba(80,200,80,0.3); }
.item-rarity.rarity-Rare       { color: rgba(120,160,255,0.9); background: rgba(80,120,255,0.08); border-color: rgba(80,120,255,0.3); }
.item-rarity.rarity-Very-Rare  { color: rgba(200,80,255,0.9);  background: rgba(180,0,255,0.08);  border-color: rgba(180,0,255,0.3); }
.item-rarity.rarity-Ultra-Rare { color: rgba(255,160,40,0.9);  background: rgba(255,140,0,0.1);   border-color: rgba(255,140,0,0.4); }

/* Pour les tueurs (grisé tant que pas fini) */
.rarity-killer-addon {
  color: rgba(150,150,150,0.5);
  background: rgba(100,100,100,0.08);
  border-color: rgba(100,100,100,0.2);
}
.rarity-bg.rarity-killer-addon {
  background-image: none;
  background-color: rgba(60,60,60,0.3);
}

/* ══════════════════════════════
   SECTION OBJET
══════════════════════════════ */
.item-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: slide-in 0.5s ease forwards;
}

.item-result {
  display: flex;
  flex-direction: column;

}

/* Carte objet principal */
.item-card {

  padding: 20px 22px;
  background: rgba(0,0,0,0.55);
  border: 2px solid rgba(255,255,255,0.08);

  transition: border-color 0.3s;
}
.item-card:hover { border-color: rgba(255,255,255,0.18); }

.item-img-wrap {

  border-radius: 12px;

  border: 2px solid rgba(255,255,255,0.08);

}
.item-img-wrap img {

}
.item-fallback {
  font-size: 2rem;
  position: relative; z-index: 1;
}

.item-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}
.item-category {
  font-family: sans-serif;
  font-size: 0.62rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(200,0,0,0.7);
  margin-bottom: 4px;
}
.item-name {
  font-size: 1.4rem;
  color: #fff;
  letter-spacing: 2px;
}
.item-background {
  font-family: sans-serif;
  font-size: 0.75rem;
  color: rgba(200,200,200,0.45);

  margin-top: 4px;
}

/* Rangée accessoires */
.addons-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media(max-width:500px){ .addons-row { grid-template-columns: 1fr; } }

.addon-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px;
  transition: border-color 0.2s;
}
.addon-card:hover { border-color: rgba(255,255,255,0.15); }

.addon-img-wrap {
  position: relative;
  width: 60px; height: 60px;
  border-radius: 8px;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.08);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.4);
  font-size: 1.4rem;
}
.addon-img-wrap img {
  width: 100%; height: 100%;
  object-fit: cover; border-radius: 7px;
  position: relative; z-index: 1;
}

.addon-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.addon-name {
  font-size: 0.9rem;
  color: #fff;
  letter-spacing: 1.5px;
}
.addon-desc {
  font-family: sans-serif;
  font-size: 0.72rem;
  color: rgba(200,200,200,0.45);
  line-height: 1.5;
}
  </style>

<script src="header.js"></script>
<script>
(async function(){

  const raw = localStorage.getItem('doubleResult');
  if (!raw) { window.location.href = 'index.html'; return; }
  const result = JSON.parse(raw);
  const { character, perks, type } = result;

  // Charger les données persos pour les images
  const charsData = await fetch('data.json').then(r => r.json()).catch(()=>({killers:[],survivors:[]}));
  const charList  = type === 'Killer' ? charsData.killers : charsData.survivors;
  const charPath  = type === 'Killer' ? 'assets/Killer/' : 'assets/Survivor/';
  const charIndex = {};
  charList.forEach(c => { charIndex[c.name] = c.img; });

  // Info subtitle
  document.getElementById('result-subtitle').textContent =
    `Tirage double ${type === 'Killer' ? 'Tueur' : 'Survivant'}`;

  // ══ PRÉCHARGEMENT DES IMAGES ══
  function preloadImage(src) {
    return new Promise(resolve => {
      if (!src) { resolve(); return; }
      const img = new Image();
      img.onload = img.onerror = resolve;
      img.src = src;
    });
  }

  // Collecter toutes les URLs à précharger
  const toPreload = [];

  // Images des persos de la liste
  charList.forEach(c => toPreload.push(`${charPath}${c.img}`));

  // Image du perso gagnant
  toPreload.push(character.img);

  // Images des perks gagnantes
  perks.forEach(p => { if (p.img) toPreload.push(`assets/${p.img}`); });

  // Images des persos propriétaires des perks
  perks.forEach(p => {
    if (p.character && charIndex[p.character]) {
      toPreload.push(`${charPath}${charIndex[p.character]}`);
    }
  });

  // Précharger tout en parallèle avant de lancer l'animation
  await Promise.all([...new Set(toPreload)].map(preloadImage));

  // ══ PHASE 1 : ANIMATION ROULETTE ══

  // --- Slot personnage (horizontal) ---
  function buildCharSlot() {
    const track = document.getElementById('slotCharTrack');
    track.innerHTML = '';
    // 30 persos aléatoires + le gagnant à la fin
    // Beaucoup d'items pour un vrai défilement visible
    const fakes = [];
    for (let i = 0; i < 5; i++) {
      fakes.push(...[...charList].sort(() => Math.random()-0.5));
    }
    const items = [...fakes.slice(0, 50), { name: character.name, img: character.img.split('/').pop() }];
    items.forEach(c => {
      const div = document.createElement('div');
      div.className = 'slot-char-item';
      const img = document.createElement('img');
      img.src = c.img.includes('/') ? c.img : `${charPath}${c.img}`;
      img.alt = c.name;
      img.onerror = () => { img.style.display='none'; };
      const span = document.createElement('span');
      span.textContent = c.name;
      div.appendChild(img); div.appendChild(span);
      track.appendChild(div);
    });
    return items.length;
  }

  // --- Slots perks (vertical × 4) ---
  function buildPerkSlots() {
    const row = document.getElementById('slotsPerkRow');
    row.innerHTML = '';
    perks.forEach((winPerk, slotIdx) => {
      const wrap = document.createElement('div');
      wrap.className = 'slot-perk-wrap';
      const line = document.createElement('div');
      line.className = 'slot-perk-line';
      const track = document.createElement('div');
      track.className = 'slot-perk-track';
      track.id = 'perkTrack'+slotIdx;

      // 20 perks aléatoires + gagnante
      const allPerks = perks.concat(perks, perks, perks, perks).sort(()=>Math.random()-0.5).slice(0, 20);
      const items = [...allPerks, winPerk];
      items.forEach(p => {
        const item = document.createElement('div');
        item.className = 'slot-perk-item';
        const imgWrap = document.createElement('div');
        imgWrap.className = 'perk-slot-img';
        imgWrap.textContent = type === 'Killer' ? '🔪' : '🏃';
        if (p.img) {
          const img = document.createElement('img');
          img.src = `assets/${p.img}`;
          img.onload = () => { imgWrap.innerHTML=''; imgWrap.appendChild(img); };
        }
        const name = document.createElement('div');
        name.className = 'perk-slot-name';
        name.textContent = p.name;
        item.appendChild(imgWrap); item.appendChild(name);
        track.appendChild(item);
      });

      wrap.appendChild(line); wrap.appendChild(track);
      row.appendChild(wrap);
    });
  }

  const charCount = buildCharSlot();
  buildPerkSlots();

  // --- Animation ---
  const ITEM_W    = 172; // width + margin d'un slot perso
  const ITEM_H    = 130; // height d'un slot perk
  const STOP_DELAYS = [1800, 2500, 3200, 3900]; // perks s'arrêtent en décalé

  function animateCharSlot(totalItems) {
    return new Promise(resolve => {
      // Attendre un frame pour que le DOM soit rendu et offsetWidth correct
      requestAnimationFrame(() => {
        const track   = document.getElementById('slotCharTrack');
        const wrapper = track.parentElement;
        const wrapW   = wrapper.offsetWidth || 800;
        const finalX  = -((totalItems - 1) * ITEM_W) + (wrapW / 2) - (ITEM_W / 2);

        track.style.transition = 'none';
        track.style.transform  = 'translateX(0)';
        void track.offsetWidth;

        const dur = 3500;
        track.style.transition = `transform ${dur}ms cubic-bezier(0.12, 0.8, 0.28, 1)`;
        track.style.transform  = `translateX(${finalX}px)`;

        setTimeout(() => {
          const items = track.querySelectorAll('.slot-char-item');
          items[items.length - 1].classList.add('winner');
          resolve();
        }, dur);
      });
    });
  }

  function animatePerkSlots() {
    return new Promise(resolve => {
      let done = 0;
      perks.forEach((_, idx) => {
        const track   = document.getElementById('perkTrack' + idx);
        if (!track) return;
        const wrapper = track.parentElement;
        const wrapH   = wrapper.offsetHeight; // hauteur visible du slot
        const items   = track.querySelectorAll('.slot-perk-item');
        const total   = items.length;

        // On veut que le DERNIER item soit centré dans le wrapper
        // translateY pour amener item[total-1] au centre : -(total-1)*ITEM_H + wrapH/2 - ITEM_H/2
        const finalY = -((total - 1) * ITEM_H) + (wrapH / 2) - (ITEM_H / 2);

        track.style.transition = 'none';
        track.style.transform  = 'translateY(0)';
        void track.offsetWidth;

        const dur = STOP_DELAYS[idx];
        track.style.transition = `transform ${dur}ms cubic-bezier(0.12, 0.8, 0.28, 1)`;
        track.style.transform  = `translateY(${finalY}px)`;

        setTimeout(() => {
          items[total - 1].classList.add('winner');
          done++;
          if (done === perks.length) setTimeout(resolve, 500);
        }, dur);
      });
    });
  }

  // Lancer les deux animations en parallèle
  await Promise.all([
    animateCharSlot(charCount),
    animatePerkSlots()
  ]);

  // ══ PHASE 2 : AFFICHER LES RÉSULTATS EN DESSOUS (sans cacher les slots) ══
  // ══ TIRAGE OBJET + ACCESSOIRES ══
// À ajouter dans le script de doubleResult.html
// Appeler drawItem() après runAnimations()

async function drawItem() {
  // Survivant seulement pour l'instant
  // Pour les tueurs : ajouter killer_addons dans items.json plus tard
  if (type !== 'Survivor') {
    document.getElementById('itemSection').style.display = 'none';
    return;
  }

  const itemsData = await fetch('items.json').then(r => r.json()).catch(() => null);
  if (!itemsData) return;

  // 1. Tirer un objet aléatoire
  const items = itemsData.survivor_items;
  const item = items[Math.floor(Math.random() * items.length)];

  // 2. Tirer 2 accessoires compatibles (addons_supported de l'objet)
  const allAddons = itemsData.addons;
  const addonIndex = {};
  allAddons.forEach(a => { addonIndex[a.id] = a; });

  const compatibleAddons = item.addons_supported
    .map(id => addonIndex[id])
    .filter(Boolean);

  // Shuffle + prendre 2
  const shuffled = compatibleAddons.sort(() => Math.random() - 0.5);
  const drawn = shuffled.slice(0, 2);

  // 3. Afficher
  const rarityClass = 'rarity-' + item.rarity.replace(' ', '-');

  // Objet
  document.getElementById('itemCategory').textContent = item.category;
  document.getElementById('itemName').textContent = item.name;
  document.getElementById('itemBackground').textContent = item.background;
  document.getElementById('itemRarityBg').className = `rarity-bg ${rarityClass}`;
  document.getElementById('itemRarity').className = `item-rarity ${rarityClass}`;
  document.getElementById('itemRarity').textContent = item.rarity;

  if (item.img) {
    const img = document.getElementById('itemImg');
    img.src = `assets/${item.img}`;
    img.style.display = 'block';
    document.getElementById('itemImgFallback').style.display = 'none';
  }

  // Appliquer la bordure de rareté sur la carte
  const itemCard = document.getElementById('itemCard');
  itemCard.classList.add(rarityClass);

  // Accessoires
  drawn.forEach((addon, i) => {
    if (!addon) return;
    const addonRarityClass = 'rarity-' + addon.rarity.replace(' ', '-');

    document.getElementById(`addon${i}Name`).textContent = addon.name;
    document.getElementById(`addon${i}Desc`).textContent = addon.description;
    document.getElementById(`addon${i}RarityBg`).className = `rarity-bg ${addonRarityClass}`;
    document.getElementById(`addon${i}Rarity`).className = `item-rarity ${addonRarityClass}`;
    document.getElementById(`addon${i}Rarity`).textContent = addon.rarity;

    if (addon.img) {
      const img = document.getElementById(`addon${i}Img`);
      img.src = `assets/${addon.img}`;
      img.style.display = 'block';
    }

    document.getElementById(`addon${i}`).classList.add(addonRarityClass);
  });

  // Si 0 accessoires compatibles (ex: Carte sans addons)
  if (compatibleAddons.length === 0) {
    document.querySelector('.addons-row').innerHTML =
      '<p style="font-family:sans-serif;font-size:0.8rem;color:rgba(255,255,255,0.3);text-align:center;grid-column:span 2">Cet objet n\'a pas d\'accessoires</p>';
  }
}

  document.getElementById('finalResults').classList.add('visible');
  await drawItem();
  document.getElementById('resultActions').style.display = 'flex';
  // Scroll vers les résultats
  document.getElementById('finalResults').scrollIntoView({ behavior: 'smooth', block: 'start' });

  // Afficher personnage
  document.getElementById('result-subtitle').textContent =
    `Tirage double ${type === 'Killer' ? 'Tueur' : 'Survivant'}`;
  document.getElementById('charLabel').textContent =
    type === 'Killer' ? '🔪 Tueur tiré' : '🏃 Survivant tiré';
  document.getElementById('charName').textContent = character.name;
  document.getElementById('charType').textContent =
    type === 'Killer' ? 'Tueur — Dead by Daylight' : 'Survivant — Dead by Daylight';
  document.getElementById('charImg').src = character.img;
  document.getElementById('charImg').alt = character.name;

  // Afficher les perks
  const grid = document.getElementById('perksGrid');

  perks.forEach((perk, idx) => {
    const banner = document.createElement('div');
    banner.className = 'perk-banner';

    // Image perk
    const perkWrap = document.createElement('div');
    perkWrap.className = 'perk-img-wrap';
    perkWrap.textContent = type === 'Killer' ? '🔪' : '🏃';
    if (perk.img) {
      const img = document.createElement('img');
      img.src = `assets/${perk.img}`;
      img.alt = perk.name;
      img.onerror = () => {};
      img.onload  = () => { perkWrap.innerHTML = ''; perkWrap.appendChild(img); };
    }

    // Image personnage de la perk
    const cWrap = document.createElement('div');
    cWrap.className = 'char-img-wrap';
    cWrap.textContent = perk.character ? '👤' : '✦';
    if (perk.character && charIndex[perk.character]) {
      const img = document.createElement('img');
      img.src = `${charPath}${charIndex[perk.character]}`;
      img.alt = perk.character;
      img.onload = () => { cWrap.innerHTML = ''; cWrap.appendChild(img); };
    }

    // Texte
    const text = document.createElement('div');
    text.className = 'perk-text';
    text.innerHTML = `
      <span class="perk-name">${perk.name}</span>
      <span class="perk-origin ${perk.character ? '' : 'generic'}">${perk.character || '✦ Générique'}</span>
      <span class="perk-desc">${perk.description || ''}</span>
    `;

    banner.appendChild(perkWrap);
    banner.appendChild(cWrap);
    banner.appendChild(text);
    grid.appendChild(banner);

    // Animation décalée
    setTimeout(() => banner.classList.add('visible'), idx * 150 + 200);
  });

  // Bouton rejouer
  document.getElementById('redrawBtn').addEventListener('click', async () => {
    // Recharger les données et refaire un tirage du même type
    const [data, perksData] = await Promise.all([
      fetch('data.json').then(r=>r.json()),
      fetch('perks.json').then(r=>r.json()).catch(()=>null)
    ]);

    const rawList = type === 'Killer' ? data.killers : data.survivors;
    const newChar = rawList[Math.floor(Math.random() * rawList.length)];
    const basePath = type === 'Killer' ? 'assets/Killer/' : 'assets/Survivor/';

    let newPerks = [];
    if (perksData) {
      const section = type === 'Killer' ? perksData.killerPerks : perksData.survivorPerks;
      const perkPool = [
        ...section.generic.map(p => ({ ...p, character: null })),
        ...section.characters.flatMap(c => c.perks.map(p => ({ ...p, character: c.character })))
      ];
      const shuffled = [...perkPool];
      for (let i = shuffled.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      newPerks = shuffled.slice(0, 4);
    }

    localStorage.setItem('doubleResult', JSON.stringify({
      character: { name: newChar.name, img: `${basePath}${newChar.img}` },
      perks: newPerks,
      type
    }));
    window.location.reload();
  });

})();
</script>
