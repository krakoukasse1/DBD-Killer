<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage Double — DBD</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .result-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    /* HERO */
    .result-hero { text-align: center; }
    .result-hero h1 { font-size: clamp(2.5rem, 7vw, 5rem); color: #fff; letter-spacing: 4px; line-height: 0.9; margin-bottom: 8px; }
    .result-hero h1 span { color: #cc0000; }
    .result-hero p { font-family: sans-serif; font-size: 0.85rem; color: rgba(200,200,200,0.45); }

    /* CARTE PERSONNAGE */
    .character-card {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 28px 32px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      width: 100%;
      backdrop-filter: blur(8px);
      animation: slide-in 0.5s ease forwards;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .char-img {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid rgba(200,0,0,0.4);
      box-shadow: 0 0 30px rgba(200,0,0,0.2);
    }
    
    .char-label { font-family: sans-serif; font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(200,0,0,0.8); margin-bottom: 6px; display: block; }
    .char-name  { font-size: clamp(2rem, 5vw, 3.5rem); color: #fff; letter-spacing: 3px; line-height: 1; }
    .char-type  { font-family: sans-serif; font-size: 0.8rem; color: rgba(200,200,200,0.4); margin-top: 6px; letter-spacing: 1px; }

    /* SÉPARATEUR */
    .section-label {
      font-family: sans-serif;
      font-size: 0.65rem;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
    }
    .section-label::before,
    .section-label::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }

    /* PERKS */
    .perks-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }
    @media(max-width: 600px) { .perks-grid { grid-template-columns: 1fr; } }

    .perk-banner {
      display: grid;
      grid-template-columns: 70px 70px 1fr;
      gap: 16px;
      align-items: center;
      padding: 16px 18px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      opacity: 0;
      transform: translateX(-16px);
      transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.3s;
    }
    .perk-banner.visible { opacity: 1; transform: translateX(0); }
    .perk-banner:hover { border-color: rgba(255,255,255,0.16); }

    .perk-img-wrap {
      width: 70px; height: 70px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; flex-shrink: 0;
      overflow: hidden;
    }
    .perk-img-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }

    .char-img-wrap {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .char-img-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

    .perk-name { font-size: 1rem; color: #fff; letter-spacing: 1.5px; margin-bottom: 3px; display: block; }
    .perk-origin { font-family: sans-serif; font-size: 0.65rem; color: rgba(200,200,200,0.35); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 7px; display: block; }
    .perk-origin.generic { color: rgba(255,180,0,0.5); }
    .perk-desc { font-family: sans-serif; font-size: 0.72rem; color: rgba(200,200,200,0.5); line-height: 1.5; }

    /* ACTIONS */
    .result-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .action-btn {
      padding: 13px 28px; border-radius: 9px;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px;
      cursor: pointer; transition: all .2s; border: none;
    }
    .action-btn.primary { background: red; color: #fff; }
    .action-btn.primary:hover { background: #cc0000; transform: scale(1.03); }
    .action-btn.secondary { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); color: rgba(255,255,255,.7); }
    .action-btn.secondary:hover { border-color: rgba(255,255,255,.35); color: #fff; }

    /* ══ ANIMATION ROULETTE GRANDE LOOP ══ */
    .roulette-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .slot-char-wrap {
      position: relative;
      width: 100%;
      height: 160px;
      background: rgba(0,0,0,0.6);
      border: 2px solid rgba(200,0,0,0.4);
      border-radius: 12px;
      overflow: hidden;
    }
    .slot-char-wrap::before,
    .slot-char-wrap::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 15%;
      z-index: 3;
      pointer-events: none;
    }
    .slot-char-wrap::before { left: 0;  background: linear-gradient(to right, rgba(0,0,0,0.9), transparent); }
    .slot-char-wrap::after  { right: 0; background: linear-gradient(to left,  rgba(0,0,0,0.9), transparent); }

    .slot-char-line {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 3px;
      background: #cc0000;
      box-shadow: 0 0 10px rgba(200,0,0,0.8);
      transform: translateX(-50%);
      z-index: 4;
    }

    .slot-char-track {
      display: flex;
      align-items: center;
      height: 100%;
      padding-left: calc(50% - 80px);
      will-change: transform;
    }

    .slot-char-item {
      flex-shrink: 0;
      width: 160px;
      height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      /* Optimisation anti-disparition pour les longues listes */
      content-visibility: auto;
      contain-intrinsic-size: 160px 140px;
    }
    .slot-char-item img {
      width: 100px; height: 100px;
      border-radius: 10px; object-fit: cover;
      border: 2px solid rgba(255,255,255,0.1);
    }
    .slot-char-item span {
      font-size: 0.75rem; color: rgba(255,255,255,0.7);
      letter-spacing: 1px; text-align: center;
      max-width: 140px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    /* Slots perks (4 colonnes) */
    .slots-perks-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media(max-width:700px){ .slots-perks-row { grid-template-columns: repeat(2,1fr); } }

    .slot-perk-wrap {
      position: relative;
      height: 130px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
    }
    .slot-perk-wrap::before,
    .slot-perk-wrap::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      height: 25%;
      z-index: 3;
      pointer-events: none;
    }
    .slot-perk-wrap::before { top: 0;    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); }
    .slot-perk-wrap::after  { bottom: 0; background: linear-gradient(to top,    rgba(0,0,0,0.9), transparent); }

    .slot-perk-line {
      position: absolute;
      left: 0; right: 0;
      top: 50%; height: 2px;
      background: rgba(200,0,0,0.5);
      transform: translateY(-50%);
      z-index: 4;
    }

    .slot-perk-track {
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .slot-perk-item {
      flex-shrink: 0;
      width: 100%;
      height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      box-sizing: border-box;
    }
    .slot-perk-item .perk-slot-img {
      width: 56px; height: 56px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      overflow: hidden;
    }
    .slot-perk-item .perk-slot-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .slot-perk-item .perk-slot-name {
      font-size: 0.65rem; color: rgba(255,255,255,0.65);
      letter-spacing: 0.5px; text-align: center;
      max-width: 100%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; padding: 0 4px;
    }

    /* Résultats finaux */
    .final-results {
      display: none;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }
    .final-results.visible { display: flex; }
  </style>
</head>
<body>

<main class="result-page">

  <div class="result-hero">
    <h1>Ton <span>Build</span></h1>
    <p id="result-subtitle">Chargement…</p>
  </div>

  <div class="roulette-section" id="rouletteSection">
    <div class="slot-char-wrap">
      <div class="slot-char-line"></div>
      <div class="slot-char-track" id="slotCharTrack"></div>
    </div>
    <div class="slots-perks-row" id="slotsPerkRow"></div>
  </div>

  <div class="final-results" id="finalResults">
    <div class="character-card" id="charCard">
      <img class="char-img" id="charImg" src="" alt="">
      <div class="char-info">
        <span class="char-label" id="charLabel">Personnage tiré</span>
        <div class="char-name" id="charName">—</div>
        <div class="char-type" id="charType"></div>
      </div>
    </div>
    <div class="section-label">4 Perks tirées</div>
    <div class="perks-grid" id="perksGrid"></div>
  </div>

  <div class="result-actions" id="resultActions" style="display:none;">
    <button class="action-btn primary" id="redrawBtn">↻ Nouveau tirage</button>
    <button class="action-btn secondary" onclick="window.location.href='index.html'">← Accueil</button>
  </div>

</main>

<script>
(async function(){

  const raw = localStorage.getItem('doubleResult');
  if (!raw) { window.location.href = 'index.html'; return; }
  const result = JSON.parse(raw);
  const { character, perks, type } = result;

  const charsData = await fetch('data.json').then(r => r.json()).catch(()=>({killers:[],survivors:[]}));
  let charList  = type === 'Killer' ? (charsData.killers || []) : (charsData.survivors || []);
  const charPath  = type === 'Killer' ? 'assets/Killer/' : 'assets/Survivor/';
  const charIndex = {};
  charList.forEach(c => { charIndex[c.name] = c.img; });

  const perksJson = await fetch('perks.json').then(r => r.json()).catch(() => null);
  let globalPerksPool = [];
  if (perksJson) {
    const sec = type === 'Killer' ? perksJson.killerPerks : perksJson.survivorPerks;
    if(sec) {
      globalPerksPool = [...sec.generic, ...sec.characters.flatMap(c => c.perks)];
    }
  }

  document.getElementById('result-subtitle').textContent = `Tirage double ${type === 'Killer' ? 'Tueur' : 'Survivant'}`;

  // Grille du bas (Gagnants fixes)
  const grid = document.getElementById('perksGrid');
  grid.innerHTML = '';
  perks.forEach((perk) => {
    const banner = document.createElement('div');
    banner.className = 'perk-banner';
    const perkWrap = document.createElement('div');
    perkWrap.className = 'perk-img-wrap';
    perkWrap.textContent = type === 'Killer' ? '🔪' : '🏃';
    if (perk.img) {
      const img = document.createElement('img');
      img.src = `assets/${perk.img}`;
      img.onload = () => { perkWrap.innerHTML = ''; perkWrap.appendChild(img); };
    }
    const cWrap = document.createElement('div');
    cWrap.className = 'char-img-wrap';
    cWrap.textContent = perk.character ? '👤' : '✦';
    if (perk.character && charIndex[perk.character]) {
      const img = document.createElement('img');
      img.src = `${charPath}${charIndex[perk.character]}`;
      img.onload = () => { cWrap.innerHTML = ''; cWrap.appendChild(img); };
    }
    const text = document.createElement('div');
    text.className = 'perk-text';
    text.innerHTML = `
      <span class="perk-name">${perk.name}</span>
      <span class="perk-origin ${perk.character ? '' : 'generic'}">${perk.character || '✦ Générique'}</span>
      <span class="perk-desc">${perk.description || ''}</span>
    `;
    banner.appendChild(perkWrap); banner.appendChild(cWrap); banner.appendChild(text);
    grid.appendChild(banner);
  });

  // --- ROULETTE PERSO MAX LOOP (60 ÉLÉMENTS) ---
  function buildCharSlot() {
    const track = document.getElementById('slotCharTrack');
    track.innerHTML = '';
    
    let fullShuffledPool = [...charList].sort(() => Math.random() - 0.5);
    
    // On duplique intelligemment pour atteindre une très longue boucle de défilement
    while(fullShuffledPool.length < 65) {
      fullShuffledPool = fullShuffledPool.concat([...charList].sort(() => Math.random() - 0.5));
    }
    
    // On prend exactement 59 fakes et on met le vrai gagnant en 60ème position
    const finalItems = fullShuffledPool.slice(0, 59);
    finalItems.push({ name: character.name, img: character.img.split('/').pop() });

    finalItems.forEach(c => {
      const div = document.createElement('div');
      div.className = 'slot-char-item';
      const img = document.createElement('img');
      img.src = c.img.includes('/') ? c.img : `${charPath}${c.img}`;
      const span = document.createElement('span');
      span.textContent = c.name;
      div.appendChild(img); div.appendChild(span);
      track.appendChild(div);
    });
    return finalItems.length;
  }

  // --- Roulette Perks (Alignée sur 30 éléments pour garder le rythme) ---
  function buildPerkSlots() {
    const row = document.getElementById('slotsPerkRow');
    row.innerHTML = '';
    
    perks.forEach((winPerk, slotIdx) => {
      const wrap = document.createElement('div');
      wrap.className = 'slot-perk-wrap';
      const line = document.createElement('div');
      line.className = 'slot-perk-line';
      const track = document.createElement('div');
      track.className = 'slot-perk-track';
      track.id = 'perkTrack'+slotIdx;

      let fullPerksShuffled = [...globalPerksPool].sort(() => Math.random() - 0.5);
      while(fullPerksShuffled.length < 35) {
        fullPerksShuffled = fullPerksShuffled.concat([...globalPerksPool].sort(() => Math.random() - 0.5));
      }
      
      const finalPerks = fullPerksShuffled.slice(0, 29);
      finalPerks.push(winPerk);

      finalPerks.forEach(p => {
        const item = document.createElement('div');
        item.className = 'slot-perk-item';
        const imgWrap = document.createElement('div');
        imgWrap.className = 'perk-slot-img';
        imgWrap.textContent = type === 'Killer' ? '🔪' : '🏃';
        if (p.img) {
          const img = document.createElement('img');
          img.src = `assets/${p.img}`;
          img.onload = () => { imgWrap.innerHTML=''; imgWrap.appendChild(img); };
        }
        const name = document.createElement('div');
        name.className = 'perk-slot-name';
        name.textContent = p.name;
        item.appendChild(imgWrap); item.appendChild(name);
        track.appendChild(item);
      });
      wrap.appendChild(line); wrap.appendChild(track);
      row.appendChild(wrap);
    });
  }

  const charCount = buildCharSlot();
  buildPerkSlots();

  // --- Animation fluide avec ajustement du timing pour la longue piste ---
  function runAnimations() {
    return new Promise(resolve => {
      // 1. Animation Personnage (Sur 60 éléments, on augmente légèrement le temps à 4.5s pour garder un effet réaliste)
      const charTrack = document.getElementById('slotCharTrack');
      const finalX = -((charCount - 1) * 160);
      charTrack.style.transition = 'transform 4.5s cubic-bezier(0.05, 0.75, 0.1, 1)';
      charTrack.style.transform = `translateX(${finalX}px)`;

      // 2. Animation Perks (Échelonnées pour finir en décalé après le personnage)
      const delays = [2500, 3200, 3800, 4400];
      let completed = 0;

      perks.forEach((_, idx) => {
        const perkTrack = document.getElementById('perkTrack' + idx);
        const totalItems = perkTrack.querySelectorAll('.slot-perk-item').length;
        const finalY = -((totalItems - 1) * 130);

        perkTrack.style.transition = `transform ${delays[idx]}ms cubic-bezier(0.1, 0.8, 0.15, 1)`;
        perkTrack.style.transform = `translateY(${finalY}px)`;

        setTimeout(() => {
          completed++;
          if(completed === 4) resolve();
        }, 4500);
      });
    });
  }

  // Lancement
  setTimeout(async () => {
    await runAnimations();

    // Révélation finale
    document.getElementById('charLabel').textContent = type === 'Killer' ? '🔪 Tueur tiré' : '🏃 Survivant tiré';
    document.getElementById('charName').textContent = character.name;
    document.getElementById('charType').textContent = type === 'Killer' ? 'Tueur — Dead by Daylight' : 'Survivant — Dead by Daylight';
    document.getElementById('charImg').src = character.img;

    document.getElementById('finalResults').classList.add('visible');
    document.getElementById('resultActions').style.display = 'flex';
    
    document.querySelectorAll('.perk-banner').forEach((banner, idx) => {
      setTimeout(() => banner.classList.add('visible'), idx * 150 + 100);
    });
  }, 400);

  // Bouton Nouveau Tirage
  document.getElementById('redrawBtn').addEventListener('click', async () => {
    const [data, perksData] = await Promise.all([
      fetch('data.json').then(r=>r.json()).catch(()=>({killers:[],survivors:[]})),
      fetch('perks.json').then(r=>r.json()).catch(()=>null)
    ]);
    const rawList = type === 'Killer' ? data.killers : data.survivors;
    const newChar = rawList[Math.floor(Math.random() * rawList.length)];
    const basePath = type === 'Killer' ? 'assets/Killer/' : 'assets/Survivor/';

    let newPerks = [];
    if (perksData) {
      const section = type === 'Killer' ? perksData.killerPerks : perksData.survivorPerks;
      const perkPool = [
        ...section.generic.map(p => ({ ...p, character: null })),
        ...section.characters.flatMap(c => c.perks.map(p => ({ ...p, character: c.character })))
      ];
      const shuffled = [...perkPool].sort(() => Math.random() - 0.5);
      newPerks = shuffled.slice(0, 4);
    }

    localStorage.setItem('doubleResult', JSON.stringify({
      character: { name: newChar.name, img: `${basePath}${newChar.img}` },
      perks: newPerks,
      type
    }));
    window.location.reload();
  });

})();
</script>
</body>
</html>
