<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
</head>

<body>

<h2>Connexion Twitch</h2>

<button id="btnConnect">Se connecter</button>

<button id="btnDraw">Test tirage</button>

<input id="items" value="Trapper,Huntress,Wraith">

<script>
const BACKEND = "https://dbd-killer-1.onrender.com";

document.getElementById("btnConnect").onclick = () => {
  window.location.href = BACKEND + "/auth/twitch";
};

document.getElementById("btnDraw").onclick = async () => {
  const items = document.getElementById("items").value.split(",");

  const res = await fetch(BACKEND + "/api/draw-and-announce", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    credentials: "include",
    body: JSON.stringify({ items })
  });

  console.log(await res.json());
};
</script>

</body>
</html>
